// ---------------------------------------------------------------------------
// Achats & fournisseurs (module 7)
// Dette d'un bon = valeur reçue - payé ; les acomptes avant livraison sont
// possibles (jamais plus que le total commandé). Réception réservée au
// propriétaire / gérant ; le comptable voit et paie.
// ---------------------------------------------------------------------------
const PO_STATUS = {
  brouillon: { label: 'Brouillon', cls: '' },
  commande:  { label: 'Commandé', cls: 'warn' },
  partiel:   { label: 'Reçu partiellement', cls: 'accent' },
  recu:      { label: 'Reçu', cls: 'ok' },
  annule:    { label: 'Annulé', cls: 'bad' },
};
function poDebt(po) {
  if (po.status === 'brouillon' || po.status === 'annule') return 0;
  return Math.max(0, (Number(po.received_value) || 0) - (Number(po.amount_paid) || 0));
}
function poToPay(po) {
  if (po.status === 'brouillon' || po.status === 'annule') return 0;
  return Math.max(0, (Number(po.total) || 0) - (Number(po.amount_paid) || 0));
}
function poOverdue(po) {
  if (!po.due_date || poDebt(po) <= 0) return false;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return new Date(po.due_date + 'T00:00:00') < today;
}
function canReceive() {
  return currentProfile && ['owner', 'gerant'].includes(currentProfile.role);
}
function supplierDebt(supplierId) {
  return Object.values(purchaseOrders).filter(po => po.supplier_id === supplierId).reduce((s, po) => s + poDebt(po), 0);
}

async function loadPurchasing() {
  if (!canManageInvoices()) { suppliersMap = {}; purchaseOrders = {}; return; }
  const [sup, pos] = await Promise.all([
    supa.from('suppliers').select('*').order('name'),
    supa.from('purchase_orders').select('*, purchase_order_lines(*), supplier_payments(*)').order('created_at', { ascending: false }).limit(500),
  ]);
  if (sup.error) console.error(sup.error);
  if (pos.error) console.error(pos.error);
  suppliersMap = {};
  (sup.data || []).forEach(s => { suppliersMap[s.id] = s; });
  purchaseOrders = {};
  (pos.data || []).forEach(po => {
    po.purchase_order_lines = (po.purchase_order_lines || []).slice().sort((a, b) => a.position - b.position);
    po.supplier_payments = (po.supplier_payments || []).slice().sort((a, b) => new Date(a.paid_at) - new Date(b.paid_at));
    purchaseOrders[po.id] = po;
  });
  renderPurchasing();
  renderDashboard();
}

function renderPurchasing() {
  const host = document.getElementById('poList');
  if (!host) return;
  const all = Object.values(purchaseOrders);
  const debt = all.reduce((s, po) => s + poDebt(po), 0);
  const toReceive = all.filter(po => po.status === 'commande' || po.status === 'partiel').length;
  const late = all.filter(poOverdue);
  document.getElementById('purchaseTiles').innerHTML = `
    <div class="tile"><div class="label">Dettes fournisseurs</div><div class="value small">${fmtFCFA(debt)}</div></div>
    <div class="tile"><div class="label">À recevoir</div><div class="value">${toReceive}</div></div>
    <div class="tile"><div class="label">En retard</div><div class="value ${late.length ? 'small' : ''}" style="${late.length ? 'color:var(--bad)' : ''}">${late.length ? fmtFCFA(late.reduce((s, po) => s + poDebt(po), 0)) : '0'}</div></div>`;

  const filter = document.getElementById('poFilter')?.value || '';
  const search = (document.getElementById('poSearchInput')?.value || '').trim().toLowerCase();

  if (filter === 'fournisseurs') {
    let list = Object.entries(suppliersMap).sort((a, b) => a[1].name.localeCompare(b[1].name, 'fr'));
    if (search) list = list.filter(([, s]) => s.name.toLowerCase().includes(search) || (s.phone || '').includes(search));
    host.innerHTML = list.length === 0
      ? `<div class="empty-state">${Object.keys(suppliersMap).length ? 'Aucun fournisseur trouvé.' : 'Aucun fournisseur. Ajoutez le premier ci-dessus.'}</div>`
      : list.map(([id, s]) => {
          const d = supplierDebt(id);
          return `<div class="article-row" data-sup="${id}">
            <div class="info"><div class="name">${escapeHtml(s.name)}</div>
              <div class="meta">${escapeHtml(s.phone || 'Pas de téléphone')}${s.payment_terms_days ? ` · paiement à ${s.payment_terms_days} j` : ' · paiement comptant'}</div></div>
            <div class="qty ${d > 0 ? 'bad' : 'good'}">${d > 0 ? fmtFCFA(d) + '<span class="unit">dette</span>' : 'À jour'}</div>
          </div>`;
        }).join('');
    host.querySelectorAll('[data-sup]').forEach(el => el.addEventListener('click', () => openSupplierSheet(el.dataset.sup)));
    return;
  }

  let list = Object.entries(purchaseOrders);
  if (filter === 'a_recevoir') list = list.filter(([, po]) => po.status === 'commande' || po.status === 'partiel');
  if (filter === 'a_payer') list = list.filter(([, po]) => poDebt(po) > 0);
  if (filter === 'retard') list = list.filter(([, po]) => poOverdue(po));
  if (filter === 'brouillons') list = list.filter(([, po]) => po.status === 'brouillon');
  if (search) list = list.filter(([, po]) => (po.number || '').toLowerCase().includes(search) || (po.supplier_name || '').toLowerCase().includes(search) || (po.supplier_ref || '').toLowerCase().includes(search));
  if (list.length === 0) {
    host.innerHTML = `<div class="empty-state">${Object.keys(purchaseOrders).length ? 'Aucun bon de commande ne correspond.' : (Object.keys(suppliersMap).length ? 'Aucun bon de commande. Créez le premier ci-dessus.' : 'Commencez par ajouter un fournisseur, puis créez un bon de commande.')}</div>`;
    return;
  }
  host.innerHTML = list.map(([id, po]) => {
    const st = PO_STATUS[po.status] || { label: po.status, cls: '' };
    const d = poDebt(po);
    return `<div class="article-row" data-po="${id}">
      <div class="info"><div class="name">${escapeHtml(po.number || 'Bon de commande (brouillon)')}</div>
        <div class="meta">${escapeHtml(po.supplier_name || '—')} · ${fmtDate(po.order_date || po.created_at)}
          <span class="doc-badge ${st.cls}">${st.label}</span>${poOverdue(po) ? ' <span class="doc-badge bad">En retard</span>' : ''}</div></div>
      ${d > 0
        ? `<div class="qty bad">${fmtFCFA(d)}<span class="unit">dette</span></div>`
        : `<div class="qty">${fmtFCFA(po.total)}<span class="unit">commandé</span></div>`}
    </div>`;
  }).join('');
  host.querySelectorAll('[data-po]').forEach(el => el.addEventListener('click', () => openPurchaseOrderView(el.dataset.po)));
}
document.getElementById('poFilter')?.addEventListener('change', renderPurchasing);
document.getElementById('poSearchInput')?.addEventListener('input', renderPurchasing);

// ---- Fournisseurs
function openSupplierSheet(id = null) {
  const s = id ? suppliersMap[id] : null;
  const pos = id ? Object.values(purchaseOrders).filter(po => po.supplier_id === id) : [];
  const backdrop = openFormSheet({
    title: s ? 'Fournisseur' : 'Nouveau fournisseur',
    intro: s ? `Dette actuelle : <strong>${fmtFCFA(supplierDebt(id))}</strong> · ${pos.filter(p => p.status !== 'brouillon').length} commande(s)` : '',
    fields: [
      { id: 'name', label: 'Nom', value: s?.name || '', required: true, placeholder: 'Ex : Grossiste Adjamé' },
      { id: 'contact_name', label: 'Contact', value: s?.contact_name || '' },
      { id: 'phone', label: 'Téléphone', value: s?.phone || '' },
      { id: 'email', label: 'Email', type: 'email', value: s?.email || '' },
      { id: 'address', label: 'Adresse', value: s?.address || '' },
      { id: 'payment_terms_days', label: 'Délai de paiement habituel (jours)', type: 'number', min: 0, step: 1, value: s?.payment_terms_days ?? 0,
        hint: '0 = paiement comptant. Sert à calculer l\'échéance quand une commande est passée.' },
      { id: 'notes', label: 'Notes', type: 'textarea', value: s?.notes || '' },
    ],
    submitLabel: s ? 'Enregistrer' : 'Ajouter le fournisseur',
    onSubmit: async (v) => {
      if (!v.name.trim()) throw new Error('Le nom est obligatoire.');
      const payload = {
        name: v.name.trim(), contact_name: v.contact_name.trim() || null, phone: v.phone.trim() || null,
        email: v.email.trim() || null, address: v.address.trim() || null,
        payment_terms_days: Math.max(0, parseInt(v.payment_terms_days, 10) || 0), notes: v.notes.trim() || null,
      };
      const { error } = s
        ? await supa.from('suppliers').update(payload).eq('id', id)
        : await supa.from('suppliers').insert({ ...payload, shop_id: currentProfile.shop_id });
      if (error) throw error;
      await loadPurchasing();
      toast('Fournisseur enregistré.');
    },
  });
  if (s && canReceive()) {
    const form = backdrop.querySelector('form');
    const del = document.createElement('button');
    del.type = 'button'; del.className = 'btn btn-ghost btn-block'; del.textContent = 'Supprimer le fournisseur';
    del.addEventListener('click', async () => {
      if (pos.some(p => p.status !== 'brouillon' && p.status !== 'annule' && (poDebt(p) > 0 || p.status !== 'recu'))) {
        toast('Ce fournisseur a des commandes en cours ou une dette : impossible de le supprimer.');
        return;
      }
      const { error } = await supa.from('suppliers').delete().eq('id', id);
      if (error) { toast(error.message); return; }
      backdrop.remove();
      await loadPurchasing();
      toast('Fournisseur supprimé.');
    });
    form.appendChild(del);
  }
}

// ---- Éditeur de bon de commande
function openPurchaseOrderEditor(id = null) {
  if (Object.keys(suppliersMap).length === 0) {
    toast("Ajoutez d'abord un fournisseur.");
    openSupplierSheet(null);
    return;
  }
  const po = id ? purchaseOrders[id] : null;
  let lines = po
    ? po.purchase_order_lines.map(l => ({ article_id: l.article_id || '', description: l.description, qty: l.qty_ordered, unit_cost: Number(l.unit_cost) }))
    : [{ article_id: '', description: '', qty: 1, unit_cost: '' }];
  const supplierOptions = Object.entries(suppliersMap).sort((a, b) => a[1].name.localeCompare(b[1].name, 'fr'))
    .map(([sid, s]) => `<option value="${sid}" ${po?.supplier_id === sid ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('');
  const articleOptions = Object.entries(articles).sort((a, b) => a[1].name.localeCompare(b[1].name, 'fr'))
    .map(([aid, a]) => `<option value="${aid}">${escapeHtml(a.name)} (${a.qty ?? 0} en stock)</option>`).join('');

  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheet-head"><h2>${po ? 'Modifier le bon de commande' : 'Nouveau bon de commande'}</h2><button class="sheet-close" type="button">✕</button></div>
      <form id="poForm">
        <div class="field"><label for="poSupplier">Fournisseur</label><select id="poSupplier" required>${supplierOptions}</select></div>
        <div class="doc-lines" id="poLines"></div>
        <button type="button" class="btn btn-ghost btn-block" id="addPoLineBtn">+ Ajouter une ligne</button>
        <div class="doc-totals" id="poTotal"></div>
        <div class="field-row">
          <div class="field"><label for="poExpected">Livraison prévue</label><input id="poExpected" type="date" value="${po?.expected_date || ''}"></div>
          <div class="field"><label for="poDue">Échéance de paiement</label><input id="poDue" type="date" value="${po?.due_date || ''}"></div>
        </div>
        <div class="current-stock-hint" id="poDueHint"></div>
        <div class="field"><label for="poRef">Réf. facture / proforma fournisseur</label><input id="poRef" value="${escapeHtml(po?.supplier_ref || '')}" placeholder="Facultatif"></div>
        <div class="field"><label for="poNotes">Notes</label><textarea id="poNotes">${escapeHtml(po?.notes || '')}</textarea></div>
        <p class="sheet-error" id="poError"></p>
        <button type="submit" class="btn btn-primary btn-block">Enregistrer le brouillon</button>
        <button type="button" class="btn btn-ghost btn-block" id="poSavePlaceBtn">Enregistrer et passer la commande</button>
      </form>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  backdrop.querySelector('.sheet-close').addEventListener('click', close);

  const supSel = document.getElementById('poSupplier');
  const dueHint = () => {
    const s = suppliersMap[supSel.value];
    document.getElementById('poDueHint').textContent = s?.payment_terms_days
      ? `Si l'échéance est vide, elle sera fixée à ${s.payment_terms_days} jours après la commande (délai habituel de ce fournisseur).`
      : "Si l'échéance est vide, le paiement sera attendu le jour de la commande (comptant).";
  };
  supSel.addEventListener('change', dueHint);
  dueHint();

  const total = () => lines.reduce((s, l) => s + Math.round((Number(l.qty) || 0) * (Number(l.unit_cost) || 0)), 0);
  const renderTotal = () => { document.getElementById('poTotal').innerHTML = `<div class="grand"><span>Total commandé</span><span>${fmtFCFA(total())}</span></div>`; };
  function renderLines() {
    const host = document.getElementById('poLines');
    host.innerHTML = lines.map((l, i) => `
      <div class="doc-line" data-idx="${i}">
        <label class="full">Article<select data-f="article_id"><option value="">— Ligne libre (hors stock) —</option>${articleOptions}</select></label>
        <label class="full">Désignation<input data-f="description" value="${escapeHtml(l.description)}"></label>
        <label>Quantité<input data-f="qty" type="number" min="1" step="1" inputmode="numeric" value="${l.qty}"></label>
        <label>Coût unitaire<input data-f="unit_cost" type="number" min="0" step="1" inputmode="numeric" value="${l.unit_cost}"></label>
        <div class="line-foot">
          <button type="button" class="remove-line" ${lines.length === 1 ? 'hidden' : ''}>Retirer la ligne</button>
          <strong data-total>${fmtFCFA(Math.round((Number(l.qty) || 0) * (Number(l.unit_cost) || 0)))}</strong>
        </div>
      </div>`).join('');
    host.querySelectorAll('.doc-line').forEach(row => {
      const i = Number(row.dataset.idx);
      const refresh = () => { row.querySelector('[data-total]').textContent = fmtFCFA(Math.round((Number(lines[i].qty) || 0) * (Number(lines[i].unit_cost) || 0))); renderTotal(); };
      const sel = row.querySelector('[data-f="article_id"]');
      sel.value = lines[i].article_id || '';
      sel.addEventListener('change', () => {
        lines[i].article_id = sel.value;
        const a = articles[sel.value];
        if (a) {
          lines[i].description = a.name; lines[i].unit_cost = Number(a.buy_price) || 0;
          row.querySelector('[data-f="description"]').value = a.name;
          row.querySelector('[data-f="unit_cost"]').value = lines[i].unit_cost;
        }
        refresh();
      });
      row.querySelector('[data-f="description"]').addEventListener('input', (e) => { lines[i].description = e.target.value; });
      row.querySelector('[data-f="qty"]').addEventListener('input', (e) => { lines[i].qty = e.target.value; refresh(); });
      row.querySelector('[data-f="unit_cost"]').addEventListener('input', (e) => { lines[i].unit_cost = e.target.value; refresh(); });
      row.querySelector('.remove-line').addEventListener('click', () => { lines.splice(i, 1); renderLines(); });
    });
    renderTotal();
  }
  renderLines();
  document.getElementById('addPoLineBtn').addEventListener('click', () => {
    lines.push({ article_id: '', description: '', qty: 1, unit_cost: '' });
    renderLines();
  });

  async function save(andPlace) {
    const errEl = document.getElementById('poError');
    errEl.textContent = '';
    const cleaned = lines.filter(l => l.article_id || String(l.description).trim()).map(l => ({
      article_id: l.article_id || null, description: String(l.description || '').trim(),
      qty: parseInt(l.qty, 10), unit_cost: Number(l.unit_cost),
    }));
    if (cleaned.length === 0) { errEl.textContent = 'Ajoutez au moins une ligne.'; return; }
    if (cleaned.some(l => !(l.qty > 0))) { errEl.textContent = 'Chaque ligne doit avoir une quantité d\'au moins 1.'; return; }
    if (cleaned.some(l => !(l.unit_cost >= 0))) { errEl.textContent = 'Chaque ligne doit avoir un coût.'; return; }
    if (!navigator.onLine) { errEl.textContent = 'Connexion internet nécessaire.'; return; }
    const buttons = backdrop.querySelectorAll('button'); buttons.forEach(b => b.disabled = true);
    try {
      const { data: poId, error } = await supa.rpc('save_purchase_order', {
        p_id: po ? id : null, p_supplier_id: supSel.value, p_lines: cleaned,
        p_expected_date: document.getElementById('poExpected').value || null,
        p_due_date: document.getElementById('poDue').value || null,
        p_supplier_ref: document.getElementById('poRef').value, p_notes: document.getElementById('poNotes').value,
      });
      if (error) throw error;
      let number = null;
      if (andPlace) {
        const r = await supa.rpc('place_purchase_order', { p_id: poId });
        if (r.error) { await loadPurchasing(); throw new Error(`Brouillon enregistré, mais commande impossible : ${r.error.message}`); }
        number = r.data;
      }
      markActivity();
      await loadPurchasing();
      close();
      toast(number ? `Commande ${number} passée.` : 'Brouillon enregistré.');
      openPurchaseOrderView(poId);
    } catch (err) {
      console.error(err);
      errEl.textContent = err.message || "Erreur lors de l'enregistrement.";
      buttons.forEach(b => b.disabled = false);
    }
  }
  document.getElementById('poForm').addEventListener('submit', (e) => { e.preventDefault(); save(false); });
  document.getElementById('poSavePlaceBtn').addEventListener('click', () => save(true));
}

// ---- Fiche d'un bon de commande
function openPurchaseOrderView(id) {
  const po = purchaseOrders[id];
  if (!po) return;
  const st = PO_STATUS[po.status] || { label: po.status, cls: '' };
  const debt = poDebt(po), toPay = poToPay(po);
  const actions = [];
  if (po.status === 'brouillon') actions.push(['place', 'Passer la commande', 'primary'], ['edit', 'Modifier', 'ghost']);
  if ((po.status === 'commande' || po.status === 'partiel') && canReceive()) actions.push(['receive', 'Réceptionner la marchandise', 'primary']);
  if (toPay > 0) actions.push(['pay', debt > 0 ? 'Payer le fournisseur' : 'Verser un acompte', debt > 0 ? 'primary' : 'ghost']);
  actions.push(['print', 'Imprimer / PDF', 'ghost']);
  if (po.supplier_id && suppliersMap[po.supplier_id]) actions.push(['supplier', 'Voir le fournisseur', 'ghost']);
  if (po.status === 'commande' && canReceive() && (Number(po.amount_paid) || 0) === 0) actions.push(['cancel', 'Annuler la commande', 'ghost']);
  if (po.status === 'brouillon') actions.push(['delete', 'Supprimer le brouillon', 'ghost']);

  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheet-head"><h2>${escapeHtml(po.number || 'Bon de commande (brouillon)')}</h2><button class="sheet-close" type="button">✕</button></div>
      <div><span class="doc-badge ${st.cls}">${st.label}</span>${poOverdue(po) ? ' <span class="doc-badge bad">Paiement en retard</span>' : ''}</div>
      <div class="doc-meta">
        <div>Fournisseur : <strong>${escapeHtml(po.supplier_name || '—')}</strong>${po.supplier_ref ? ` · Réf. ${escapeHtml(po.supplier_ref)}` : ''}</div>
        <div>${po.order_date ? `Commandé le <strong>${fmtDate(po.order_date)}</strong>` : 'Pas encore commandé'}${po.expected_date ? ` · Livraison prévue <strong>${fmtDate(po.expected_date)}</strong>` : ''}</div>
        ${po.due_date ? `<div>Échéance de paiement : <strong>${fmtDate(po.due_date)}</strong></div>` : ''}
        ${po.status === 'annule' ? `<div>Motif d'annulation : <strong>${escapeHtml(po.cancel_reason || '')}</strong></div>` : ''}
      </div>
      <div class="doc-view-lines">${po.purchase_order_lines.map(l => `
        <div class="doc-view-line"><div class="d">${escapeHtml(l.description)}<small>${l.qty_ordered} × ${fmtFCFA(l.unit_cost)}${po.status !== 'brouillon' ? ` · reçu ${l.qty_received}/${l.qty_ordered}` : ''}${l.article_id ? '' : ' · hors stock'}</small></div>
        <div class="t">${fmtFCFA(l.line_total)}</div></div>`).join('')}</div>
      <div class="doc-totals">
        <div class="grand"><span>Total commandé</span><span>${fmtFCFA(po.total)}</span></div>
        ${po.status !== 'brouillon' ? `
          <div><span>Valeur reçue</span><span>${fmtFCFA(po.received_value)}</span></div>
          <div><span>Déjà payé</span><span>${fmtFCFA(po.amount_paid)}</span></div>
          <div class="${debt > 0 ? 'due' : ''}"><span>Dette actuelle</span><span>${fmtFCFA(debt)}</span></div>
          ${toPay > debt ? `<div><span>Reste à payer sur la commande</span><span>${fmtFCFA(toPay)}</span></div>` : ''}` : ''}
      </div>
      ${po.supplier_payments.length ? `<h3>Paiements</h3><div class="doc-view-lines">${po.supplier_payments.map(p => `
        <div class="doc-view-line"><div class="d">${PAY_METHODS[p.method] || p.method}<small>${fmtDate(p.paid_at)}${p.reference ? ' · Réf. ' + escapeHtml(p.reference) : ''}</small></div>
        <div class="t">${fmtFCFA(p.amount)}</div></div>`).join('')}</div>` : ''}
      ${po.notes ? `<div class="current-stock-hint">Notes : ${escapeHtml(po.notes)}</div>` : ''}
      ${(po.status === 'commande' || po.status === 'partiel') && !canReceive() ? '<div class="current-stock-hint">La réception de la marchandise est faite par le propriétaire ou le gérant.</div>' : ''}
      <div style="display:flex; flex-direction:column; gap:8px">
        ${actions.map(([k, l, kind]) => `<button type="button" class="btn btn-${kind} btn-block" data-action="${k}">${l}</button>`).join('')}
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  backdrop.querySelector('.sheet-close').addEventListener('click', close);
  const reopen = () => setTimeout(() => openPurchaseOrderView(id), 0);

  backdrop.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', async () => {
    const a = btn.dataset.action;
    if (a === 'edit') { close(); openPurchaseOrderEditor(id); return; }
    if (a === 'print') { printPurchaseOrder(id); return; }
    if (a === 'supplier') { close(); openSupplierSheet(po.supplier_id); return; }
    if (a === 'place') {
      const { data, error } = await supa.rpc('place_purchase_order', { p_id: id });
      if (error) { toast(error.message); return; }
      markActivity(); await loadPurchasing(); close(); toast(`Commande ${data} passée.`); reopen(); return;
    }
    if (a === 'receive') { close(); openReceiveSheet(id); return; }
    if (a === 'pay') {
      close();
      openFormSheet({
        title: debt > 0 ? 'Payer le fournisseur' : 'Verser un acompte',
        intro: `${escapeHtml(po.number)} · ${escapeHtml(po.supplier_name || '')}<br>Dette actuelle : <strong>${fmtFCFA(debt)}</strong> · reste à payer sur la commande : <strong>${fmtFCFA(toPay)}</strong>`,
        fields: [
          { id: 'amount', type: 'number', label: 'Montant (FCFA)', value: debt > 0 ? debt : toPay, min: 1, step: 1, required: true },
          { id: 'method', type: 'select', label: 'Moyen de paiement', value: 'especes', options: Object.entries(PAY_METHODS).map(([value, label]) => ({ value, label })) },
          { id: 'reference', label: 'Référence', placeholder: 'N° de transaction, chèque…' },
        ],
        submitLabel: 'Enregistrer le paiement',
        onSubmit: async (v) => {
          const amount = Number(v.amount);
          if (!(amount > 0)) throw new Error('Montant invalide.');
          if (amount > toPay) throw new Error(`Le montant dépasse le reste à payer sur la commande (${fmtFCFA(toPay)}).`);
          const { error } = await supa.rpc('record_supplier_payment', { p_id: id, p_amount: amount, p_method: v.method, p_reference: v.reference || null });
          if (error) throw error;
          markActivity(); await loadPurchasing(); toast('Paiement enregistré.'); reopen();
        },
      });
      return;
    }
    if (a === 'cancel') {
      close();
      openFormSheet({
        title: 'Annuler la commande',
        intro: `${escapeHtml(po.number)} restera visible avec le statut « Annulé ».`,
        fields: [{ id: 'reason', label: "Motif d'annulation", required: true, placeholder: 'Ex : fournisseur en rupture' }],
        submitLabel: "Confirmer l'annulation",
        onSubmit: async (v) => {
          if (!v.reason.trim()) throw new Error('Le motif est obligatoire.');
          const { error } = await supa.rpc('cancel_purchase_order', { p_id: id, p_reason: v.reason });
          if (error) throw error;
          await loadPurchasing(); toast('Commande annulée.'); reopen();
        },
      });
      return;
    }
    if (a === 'delete') {
      close();
      openFormSheet({
        title: 'Supprimer le brouillon', intro: 'Ce bon de commande en brouillon sera définitivement supprimé.', fields: [],
        submitLabel: 'Supprimer',
        onSubmit: async () => {
          const { error } = await supa.rpc('delete_purchase_order', { p_id: id });
          if (error) throw error;
          await loadPurchasing(); toast('Brouillon supprimé.');
        },
      });
    }
  }));
}

// ---- Réception
function openReceiveSheet(id) {
  const po = purchaseOrders[id];
  const lines = po.purchase_order_lines.map(l => ({ id: l.id, description: l.description, article_id: l.article_id, remaining: l.qty_ordered - l.qty_received, qty: l.qty_ordered - l.qty_received, unit_cost: Number(l.unit_cost) }));
  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheet-head"><h2>Réception ${escapeHtml(po.number)}</h2><button class="sheet-close" type="button">✕</button></div>
      <div class="current-stock-hint">Indiquez ce qui est effectivement arrivé (0 si une ligne n'est pas encore livrée). Les articles reçus entrent en stock immédiatement.</div>
      <form id="receiveForm">
        <div class="doc-lines">${lines.map((l, i) => `
          <div class="doc-line" data-idx="${i}">
            <div class="full"><strong>${escapeHtml(l.description)}</strong>
              <div class="current-stock-hint">Reste à recevoir : ${l.remaining}${l.article_id ? ` · en stock actuellement : ${articles[l.article_id]?.qty ?? '—'}` : ' · ligne hors stock'}</div></div>
            <label class="full">Quantité reçue<input data-f="qty" type="number" min="0" max="${l.remaining}" step="1" inputmode="numeric" value="${l.qty}" ${l.remaining === 0 ? 'disabled' : ''}></label>
          </div>`).join('')}</div>
        <label class="check-line"><input type="checkbox" id="rcvUpdatePrice" checked> Mettre à jour le prix d'achat des articles avec le coût de cette commande</label>
        <p class="sheet-error" id="rcvError"></p>
        <button type="submit" class="btn btn-primary btn-block">Valider la réception</button>
      </form>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  backdrop.querySelector('.sheet-close').addEventListener('click', close);
  backdrop.querySelectorAll('.doc-line').forEach(row => {
    const i = Number(row.dataset.idx);
    const inp = row.querySelector('[data-f="qty"]');
    inp.addEventListener('input', () => {
      let v = parseInt(inp.value, 10) || 0;
      if (v > lines[i].remaining) { v = lines[i].remaining; inp.value = v; }
      if (v < 0) { v = 0; inp.value = 0; }
      lines[i].qty = v;
    });
  });
  document.getElementById('receiveForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('rcvError');
    const payload = lines.filter(l => l.qty > 0).map(l => ({ line_id: l.id, qty: l.qty }));
    if (payload.length === 0) { errEl.textContent = 'Indiquez au moins une quantité reçue.'; return; }
    if (!navigator.onLine) { errEl.textContent = 'Connexion internet nécessaire.'; return; }
    const btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true;
    const { error } = await supa.rpc('receive_purchase_order', { p_id: id, p_lines: payload, p_update_buy_price: document.getElementById('rcvUpdatePrice').checked });
    if (error) { errEl.textContent = error.message; btn.disabled = false; return; }
    markActivity();
    await loadPurchasing();
    loadArticles(); loadMovements();
    close();
    toast('Réception enregistrée, stock mis à jour.');
    openPurchaseOrderView(id);
  });
}

// Retours & remboursements (module 5)
// ---------------------------------------------------------------------------
const RETURN_REASONS = {
  defaut: 'Défaut', erreur_commande: 'Erreur de commande', insatisfaction: 'Insatisfaction', autre: 'Autre',
};
const REFUND_LABELS = {
  remboursement: 'Remboursé au client', deduction_facture: 'Déduit de la facture',
  credit_client: 'Déduit du crédit comptoir', aucun: 'Échange / sans remboursement',
};
const REFUND_SHORT = { remboursement: 'remboursé', deduction_facture: 'avoir', credit_client: 'avoir', aucun: 'échange' };

async function loadReturns() {
  const { data, error } = await supa
    .from('returns')
    .select('*, return_lines(*)')
    .order('created_at', { ascending: false })
    .limit(500);
  if (error) { console.error(error); return; }
  returnsMap = {};
  (data || []).forEach(r => {
    r.return_lines = (r.return_lines || []).slice().sort((a, b) => a.position - b.position);
    returnsMap[r.id] = r;
  });
  renderSalesDocs();
}

// Quantités encore retournables par article d'une facture (retours précédents déduits)
function returnableByArticle(invoiceId) {
  const d = salesDocs[invoiceId];
  const left = {};
  d.sales_document_lines.forEach(l => { if (l.article_id) left[l.article_id] = (left[l.article_id] || 0) + l.qty; });
  Object.values(returnsMap).filter(r => r.source_document_id === invoiceId).forEach(r => {
    r.return_lines.forEach(l => { if (l.article_id && left[l.article_id] != null) left[l.article_id] -= l.qty; });
  });
  return left;
}
function refundedOnInvoice(invoiceId) {
  return Object.values(returnsMap)
    .filter(r => r.source_document_id === invoiceId && r.refund_type === 'remboursement')
    .reduce((s, r) => s + (Number(r.refund_amount) || 0), 0);
}

function openReturnEditor(sourceInvoiceId = null) {
  const inv = sourceInvoiceId ? salesDocs[sourceInvoiceId] : null;
  let lines;
  if (inv) {
    const left = returnableByArticle(sourceInvoiceId);
    const used = {};
    lines = inv.sales_document_lines.map(l => {
      let max = l.qty;
      if (l.article_id) {
        // Répartit le reste retournable d'un article sur ses lignes successives
        const remain = Math.max(0, (left[l.article_id] ?? 0) - (used[l.article_id] || 0));
        max = Math.min(l.qty, remain);
        used[l.article_id] = (used[l.article_id] || 0) + max;
      }
      return { article_id: l.article_id || '', description: l.description, unit_price_ttc: Number(l.unit_price_ttc), qty: 0, max, restock: !!l.article_id };
    });
  } else {
    lines = [{ article_id: '', description: '', unit_price_ttc: '', qty: 1, restock: true }];
  }

  const articleOptions = Object.entries(articles)
    .sort((a, b) => a[1].name.localeCompare(b[1].name, 'fr'))
    .map(([aid, a]) => `<option value="${aid}">${escapeHtml(a.name)}</option>`).join('');
  const customerOptions = Object.entries(customers)
    .sort((a, b) => a[1].name.localeCompare(b[1].name, 'fr'))
    .map(([cid, c]) => `<option value="${cid}">${escapeHtml(c.name)}</option>`).join('');

  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheet-head"><h2>${inv ? `Retour sur ${escapeHtml(inv.number)}` : 'Nouveau retour'}</h2><button class="sheet-close" type="button">✕</button></div>
      <form id="returnForm">
        ${inv
          ? `<div class="doc-meta"><div>Client : <strong>${escapeHtml(inv.customer_name || 'Non renseigné')}</strong></div>
             <div>Indiquez la quantité retournée pour chaque article (0 = pas retourné).</div></div>`
          : `<div class="field"><label for="retCustomer">Client</label>
               <select id="retCustomer"><option value="">— Client non enregistré —</option>${customerOptions}</select></div>
             <div class="field" id="retCustomerNameField"><label for="retCustomerName">Nom du client (facultatif)</label>
               <input id="retCustomerName" placeholder="Ex : Client comptoir"></div>`}
        <div class="doc-lines" id="retLines"></div>
        ${inv ? '' : '<button type="button" class="btn btn-ghost btn-block" id="addRetLineBtn">+ Ajouter une ligne</button>'}
        <div class="doc-totals" id="retTotal"></div>
        <div class="field-row">
          <div class="field"><label for="retReason">Motif</label>
            <select id="retReason">${Object.entries(RETURN_REASONS).map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select></div>
          <div class="field"><label for="retNote">Précision</label><input id="retNote" placeholder="Facultatif"></div>
        </div>
        <div class="field"><label for="retRefundType">Suite donnée</label><select id="retRefundType"></select></div>
        <div id="retRefundFields">
          <div class="field"><label for="retAmount">Montant (FCFA)</label><input id="retAmount" type="number" min="0" step="1" inputmode="numeric"></div>
          <div class="current-stock-hint" id="retAmountHint" style="margin-top:4px"></div>
        </div>
        <div class="field-row" id="retMethodFields">
          <div class="field"><label for="retMethod">Moyen de remboursement</label>
            <select id="retMethod">${Object.entries(PAY_METHODS).map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select></div>
          <div class="field"><label for="retRef">Référence</label><input id="retRef" placeholder="N° de transaction"></div>
        </div>
        <p class="sheet-error" id="retError"></p>
        <button type="submit" class="btn btn-primary btn-block">Enregistrer le retour</button>
      </form>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  backdrop.querySelector('.sheet-close').addEventListener('click', close);

  const custSel = document.getElementById('retCustomer');
  if (custSel) {
    custSel.addEventListener('change', () => {
      document.getElementById('retCustomerNameField').hidden = !!custSel.value;
      renderRefundOptions();
    });
  }

  const lineValue = (l) => Math.round((Number(l.qty) || 0) * (Number(l.unit_price_ttc) || 0));
  const totalValue = () => lines.reduce((s, l) => s + lineValue(l), 0);
  let amountEdited = false;

  function refundLimits() {
    const total = totalValue();
    const lim = {};
    if (inv) {
      lim.deduction_facture = Math.min(total, invoiceRemaining(inv));
      lim.remboursement = Math.min(total, Math.max(0, (Number(inv.amount_paid) || 0) - refundedOnInvoice(inv.id)));
    } else {
      lim.remboursement = total;
      const c = custSel?.value ? customers[custSel.value] : null;
      if (c && (Number(c.credit_balance) || 0) > 0) lim.credit_client = Math.min(total, Number(c.credit_balance));
    }
    return lim;
  }

  function renderRefundOptions() {
    const sel = document.getElementById('retRefundType');
    const prev = sel.value;
    const lim = refundLimits();
    const opts = [];
    if (inv && invoiceRemaining(inv) > 0) opts.push(['deduction_facture', `Déduire du reste à payer de la facture (${fmtFCFA(invoiceRemaining(inv))})`]);
    if (!inv || lim.remboursement > 0 || (Number(inv.amount_paid) || 0) > refundedOnInvoice(inv.id)) opts.push(['remboursement', 'Rembourser le client']);
    if (!inv && custSel?.value && (Number(customers[custSel.value]?.credit_balance) || 0) > 0) {
      opts.push(['credit_client', `Déduire de son crédit comptoir (${fmtFCFA(customers[custSel.value].credit_balance)})`]);
    }
    opts.push(['aucun', 'Échange / sans remboursement']);
    sel.innerHTML = opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
    if (opts.some(([v]) => v === prev)) sel.value = prev;
    syncRefundFields();
  }

  function syncRefundFields() {
    const type = document.getElementById('retRefundType').value;
    const lim = refundLimits()[type];
    document.getElementById('retRefundFields').hidden = type === 'aucun';
    document.getElementById('retMethodFields').hidden = type !== 'remboursement';
    const amount = document.getElementById('retAmount');
    if (!amountEdited) amount.value = lim != null ? lim : totalValue();
    const hints = {
      deduction_facture: `Maximum : ${fmtFCFA(lim ?? 0)} (valeur retournée, dans la limite du reste à payer).`,
      remboursement: inv
        ? `Maximum : ${fmtFCFA(lim ?? 0)} (valeur retournée, dans la limite de ce que le client a payé).`
        : `Maximum : ${fmtFCFA(lim ?? 0)} (valeur des articles retournés).`,
      credit_client: `Maximum : ${fmtFCFA(lim ?? 0)} (dans la limite de son crédit comptoir).`,
    };
    document.getElementById('retAmountHint').textContent = hints[type] || '';
  }
  document.getElementById('retRefundType').addEventListener('change', () => { amountEdited = false; syncRefundFields(); });
  document.getElementById('retAmount').addEventListener('input', () => { amountEdited = true; });

  function renderTotal() {
    const restocked = lines.filter(l => l.restock && l.article_id && Number(l.qty) > 0).reduce((s, l) => s + Number(l.qty), 0);
    document.getElementById('retTotal').innerHTML =
      `<div class="grand"><span>Valeur retournée</span><span>${fmtFCFA(totalValue())}</span></div>
       <div><span>Articles remis en stock</span><span>${restocked}</span></div>`;
    syncRefundFields();
  }

  function renderLines() {
    const host = document.getElementById('retLines');
    host.innerHTML = lines.map((l, i) => inv ? `
      <div class="doc-line" data-idx="${i}">
        <div class="full"><strong>${escapeHtml(l.description)}</strong>
          <div class="current-stock-hint">${fmtFCFA(l.unit_price_ttc)} l'unité · retournable : ${l.max}</div></div>
        <label>Quantité retournée<input data-f="qty" type="number" min="0" max="${l.max}" step="1" inputmode="numeric" value="${l.qty}" ${l.max === 0 ? 'disabled' : ''}></label>
        <label class="check-line" style="flex-direction:row; align-self:end; padding-bottom:8px">
          <input type="checkbox" data-f="restock" ${l.restock ? 'checked' : ''} ${l.article_id ? '' : 'disabled'}> Remettre en stock</label>
      </div>` : `
      <div class="doc-line" data-idx="${i}">
        <label class="full">Article
          <select data-f="article_id"><option value="">— Ligne libre —</option>${articleOptions}</select></label>
        <label class="full">Désignation<input data-f="description" value="${escapeHtml(l.description)}"></label>
        <label>Quantité<input data-f="qty" type="number" min="1" step="1" inputmode="numeric" value="${l.qty}"></label>
        <label>Prix unitaire TTC<input data-f="unit_price_ttc" type="number" min="0" step="1" inputmode="numeric" value="${l.unit_price_ttc}"></label>
        <div class="line-foot">
          <label class="check-line" style="flex-direction:row"><input type="checkbox" data-f="restock" ${l.restock ? 'checked' : ''}> Remettre en stock</label>
          <button type="button" class="remove-line" ${lines.length === 1 ? 'hidden' : ''}>Retirer</button>
        </div>
      </div>`).join('');

    host.querySelectorAll('.doc-line').forEach(row => {
      const i = Number(row.dataset.idx);
      const q = row.querySelector('[data-f="qty"]');
      q?.addEventListener('input', () => {
        let v = parseInt(q.value, 10) || 0;
        if (inv && v > lines[i].max) { v = lines[i].max; q.value = v; }
        lines[i].qty = v; renderTotal();
      });
      row.querySelector('[data-f="restock"]')?.addEventListener('change', (e) => { lines[i].restock = e.target.checked; renderTotal(); });
      const sel = row.querySelector('[data-f="article_id"]');
      if (sel) {
        sel.value = lines[i].article_id || '';
        sel.addEventListener('change', () => {
          lines[i].article_id = sel.value;
          const a = articles[sel.value];
          if (a) {
            lines[i].description = a.name;
            lines[i].unit_price_ttc = Number(a.sell_price) || 0;
            row.querySelector('[data-f="description"]').value = lines[i].description;
            row.querySelector('[data-f="unit_price_ttc"]').value = lines[i].unit_price_ttc;
          }
          renderTotal();
        });
      }
      row.querySelector('[data-f="description"]')?.addEventListener('input', (e) => { lines[i].description = e.target.value; });
      row.querySelector('[data-f="unit_price_ttc"]')?.addEventListener('input', (e) => { lines[i].unit_price_ttc = e.target.value; renderTotal(); });
      row.querySelector('.remove-line')?.addEventListener('click', () => { lines.splice(i, 1); renderLines(); });
    });
    renderTotal();
  }
  document.getElementById('addRetLineBtn')?.addEventListener('click', () => {
    lines.push({ article_id: '', description: '', unit_price_ttc: '', qty: 1, restock: true });
    renderLines();
  });
  renderLines();
  renderRefundOptions();

  document.getElementById('returnForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('retError');
    errEl.textContent = '';
    const cleaned = lines
      .filter(l => (Number(l.qty) || 0) > 0 && (l.article_id || String(l.description).trim()))
      .map(l => ({
        article_id: l.article_id || null,
        description: String(l.description || '').trim(),
        qty: parseInt(l.qty, 10),
        unit_price_ttc: Number(l.unit_price_ttc) || 0,
        restock: !!l.restock && !!l.article_id,
      }));
    if (cleaned.length === 0) { errEl.textContent = inv ? 'Indiquez au moins une quantité retournée.' : 'Ajoutez au moins une ligne.'; return; }
    const type = document.getElementById('retRefundType').value;
    const amount = type === 'aucun' ? 0 : Number(document.getElementById('retAmount').value);
    if (type !== 'aucun' && !(amount > 0)) { errEl.textContent = 'Indiquez un montant positif.'; return; }
    if (!navigator.onLine) { errEl.textContent = 'Les retours nécessitent une connexion internet.'; return; }

    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
      const { data: retId, error } = await supa.rpc('create_return', {
        p_source_document_id: inv ? inv.id : null,
        p_customer_id: !inv && custSel?.value ? custSel.value : null,
        p_customer_name: !inv && !custSel?.value ? document.getElementById('retCustomerName').value : null,
        p_lines: cleaned,
        p_reason_category: document.getElementById('retReason').value,
        p_reason_note: document.getElementById('retNote').value,
        p_refund_type: type,
        p_refund_amount: amount,
        p_refund_method: type === 'remboursement' ? document.getElementById('retMethod').value : null,
        p_refund_reference: type === 'remboursement' ? document.getElementById('retRef').value : null,
      });
      if (error) throw error;
      markActivity();
      await Promise.all([loadReturns(), loadSalesDocuments(), loadCustomers()]);
      loadArticles(); loadMovements();
      close();
      toast('Retour enregistré.');
      openReturnView(retId);
    } catch (err) {
      console.error(err);
      errEl.textContent = err.message || "Erreur lors de l'enregistrement.";
      btn.disabled = false;
    }
  });
}

function openReturnView(id) {

  if (!r) return;
  const src = salesDocs[r.source_document_id];
  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';

    : `${REFUND_LABELS[r.refund_type]} : <strong>${fmtFCFA(r.refund_amount)}</strong>${r.refund_method ? ' · ' + (PAY_METHODS[r.refund_method] || r.refund_method) : ''}${r.refund_reference ? ' · Réf. ' + escapeHtml(r.refund_reference) : ''}`;
  backdrop.innerHTML = `

        ${r.reason_note ? `<div>Précision : ${escapeHtml(r.reason_note)}</div>` : ''}
      </div>
      <div class="doc-view-lines">${r.return_lines.map(l => `
        <div class="doc-view-line"><div class="d">${escapeHtml(l.description)}<small>${l.qty} × ${fmtFCFA(l.unit_price_ttc)} · ${l.restock ? 'remis en stock' : 'non remis en stock'}</small></div>
        <div class="t">${fmtFCFA(l.line_total_ttc)}</div></div>`).join('')}</div>
      <div class="doc-totals">
        <div class="grand"><span>Valeur retournée</span><span>${fmtFCFA(r.total_ttc)}</span></div>

      <div style="display:flex; flex-direction:column; gap:8px">
        <button type="button" class="btn btn-ghost btn-block" data-action="print">Imprimer / PDF</button>
        ${src ? `<button type="button" class="btn btn-ghost btn-block" data-action="source">Voir la facture d'origine</button>` : ''}

      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  backdrop.querySelector('.sheet-close').addEventListener('click', close);

        title: 'Numéro d\'avoir FNE',

        fields: [{ id: 'fne', label: 'N° avoir FNE', value: r.fne_number || '' }],

          if (error) throw error;
          await loadReturns();
          toast('Numéro enregistré.');

        },
      });
    }
  }));
}

// ---------------------------------------------------------------------------
// Tableau de bord — indicateurs du jour et des 7 derniers jours, construits
// à partir des données déjà chargées (articles, movements) : aucune requête
// supplémentaire.
// ---------------------------------------------------------------------------
function renderDashboard() {
  const gerant = isGerant();
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const sevenDaysAgo = now.getTime() - 7 * 24 * 60 * 60 * 1000;

  const salesToday = movements.filter(m => m.type === 'vente' && new Date(m.at).getTime() >= startOfToday);
  const unitsSoldToday = salesToday.reduce((s, m) => s + (m.qty || 0), 0);
  const revenueToday = salesToday.reduce((s, m) => {
    const a = articles[m.article_id];
    return s + (m.qty || 0) * (a?.sell_price || 0);
  }, 0);

  const sales7d = movements.filter(m => m.type === 'vente' && new Date(m.at).getTime() >= sevenDaysAgo);
  const margin7d = sales7d.reduce((s, m) => {
    const a = articles[m.article_id];
    if (!a) return s;
    return s + (m.qty || 0) * ((a.sell_price || 0) - (a.buy_price || 0));
  }, 0);

  const list = Object.entries(articles);
  const lowStock = list.filter(([, a]) => (a.qty || 0) <= (a.threshold ?? 3) && (a.qty || 0) > 0);
  const outStock = list.filter(([, a]) => (a.qty || 0) <= 0);
  const alertCount = lowStock.length + outStock.length;
  const unpaidInvoices = Object.values(salesDocs).reduce((acc, d) => {
    const r = (d.doc_type === 'facture' && d.status === 'emise') ? invoiceRemaining(d) : 0;
    if (r > 0) { acc.count += 1; acc.total += r; }
    return acc;
  }, { count: 0, total: 0 });
  const supplierDebt = Object.values(purchaseOrders).reduce((s, po) => s + poDebt(po), 0);

  document.getElementById('dashboardTiles').innerHTML = `
    <div class="tile"><div class="label">Ventes aujourd'hui</div><div class="value">${unitsSoldToday}</div></div>
    ${gerant ? `<div class="tile"><div class="label">CA aujourd'hui</div><div class="value small">${fmtFCFA(revenueToday)}</div></div>` : ''}
    ${gerant ? `<div class="tile"><div class="label">Marge 7 jours</div><div class="value small">${fmtFCFA(margin7d)}</div></div>` : ''}
    ${gerant && unpaidInvoices.count > 0 ? `<div class="tile"><div class="label">Factures impayées (${unpaidInvoices.count})</div><div class="value small">${fmtFCFA(unpaidInvoices.total)}</div></div>` : ''}
    ${gerant && supplierDebt > 0 ? `<div class="tile"><div class="label">Dettes fournisseurs</div><div class="value small">${fmtFCFA(supplierDebt)}</div></div>` : ''}
  `;

  document.getElementById('dashboardAlert').innerHTML = alertCount > 0
    ? `<div class="alert-banner">⚠ ${outStock.length} article(s) épuisé(s), ${lowStock.length} en stock bas</div>`
    : '';

  // Top 5 des articles les plus vendus sur 7 jours (en quantité)
  const soldByArticle = {};
  sales7d.forEach(m => {
    soldByArticle[m.article_id] = (soldByArticle[m.article_id] || 0) + (m.qty || 0);
  });
  const top5 = Object.entries(soldByArticle)
    .map(([articleId, qty]) => ({ articleId, qty, article: articles[articleId] }))
    .filter(e => e.article)
    .sort((a, b) => b.qty - a.qty)
    .slice(0, 5);

  const topEl = document.getElementById('dashboardTopSales');
  if (top5.length === 0) {
    topEl.innerHTML = '<div class="empty-state">Aucune vente sur les 7 derniers jours.</div>';
  } else {
    topEl.innerHTML = top5.map(e => `
      <div class="article-row">
        <div class="info">
          <div class="name">${escapeHtml(e.article.name)}</div>
          <div class="meta">${escapeHtml(e.article.category || 'Sans catégorie')}</div>
        </div>
        <div class="qty">${e.qty}<span class="unit">vendus</span></div>
      </div>
    `).join('');
  }
}

function openMoveSheet(preselectId) {
  if (Object.keys(articles).length === 0) {
    toast("Ajoutez d'abord un article dans l'onglet Articles.");
    return;
  }
  const options = Object.entries(articles)
    .sort((a, b) => a[1].name.localeCompare(b[1].name, 'fr'))
    .map(([id, a]) => `<option value="${id}" ${id === preselectId ? 'selected' : ''}>${escapeHtml(a.name)} (${a.qty ?? 0} en stock)</option>`)
    .join('');

  const gerant = isGerant();
  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheet-head"><h2>Nouveau mouvement</h2><button class="sheet-close" id="closeMoveSheet">✕</button></div>
      <form id="moveForm">
        <div class="move-type-row">
          <button type="button" class="move-type-btn active" data-type="vente">Vente</button>
          ${gerant ? '<button type="button" class="move-type-btn" data-type="reassort">Réassort</button>' : ''}
          <button type="button" class="move-type-btn" data-type="perte">Casse/Perte</button>
        </div>
        <div class="field">
          <label for="moveArticle">Article</label>
          <select id="moveArticle" required>${options}</select>
        </div>
        <div class="field">
          <label>Quantité</label>
          <div class="qty-stepper">
            <button type="button" id="qtyMinus">−</button>
            <input type="number" id="moveQty" value="1" min="1" inputmode="numeric">
            <button type="button" id="qtyPlus">+</button>
          </div>
          <div class="current-stock-hint" id="stockHint"></div>
        </div>
        <div class="field" id="moveCustomerField" ${Object.keys(customers).length === 0 ? 'hidden' : ''}>
          <label for="moveCustomer">Client (optionnel)</label>
          <select id="moveCustomer">
            <option value="">— Vente au comptoir —</option>
            ${Object.entries(customers).sort((a, b) => a[1].name.localeCompare(b[1].name, 'fr'))
              .map(([cid, c]) => `<option value="${cid}">${escapeHtml(c.name)}</option>`).join('')}
          </select>
        </div>
        <label class="field" id="moveCreditField" hidden style="flex-direction:row; align-items:center; gap:8px;">
          <input type="checkbox" id="moveOnCredit" style="width:auto">
          <span>Vente à crédit (ajoutée au solde dû du client)</span>
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="moveSubmitBtn">Enregistrer la vente</button>
      </form>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
  document.getElementById('closeMoveSheet').addEventListener('click', () => backdrop.remove());

  let activeType = 'vente';
  const typeBtns = backdrop.querySelectorAll('.move-type-btn');
  const submitBtn = document.getElementById('moveSubmitBtn');
  const customerField = document.getElementById('moveCustomerField');
  const creditField = document.getElementById('moveCreditField');
  const customerSelect = document.getElementById('moveCustomer');
  const creditCheckbox = document.getElementById('moveOnCredit');
  const verbByType = { vente: 'Enregistrer la vente', reassort: "Enregistrer l'entrée", perte: 'Enregistrer la perte' };
  function updateCustomerFieldsVisibility() {
    const show = activeType === 'vente' && Object.keys(customers).length > 0;
    customerField.hidden = !show;
    creditField.hidden = !show || !customerSelect.value;
    if (!show || !customerSelect.value) creditCheckbox.checked = false;
  }
  customerSelect.addEventListener('change', updateCustomerFieldsVisibility);
  typeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      typeBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeType = btn.dataset.type;
      submitBtn.textContent = verbByType[activeType];
      updateStockHint();
      updateCustomerFieldsVisibility();
    });
  });
  updateCustomerFieldsVisibility();

  const articleSelect = document.getElementById('moveArticle');
  const qtyInput = document.getElementById('moveQty');
  function updateStockHint() {
    const a = articles[articleSelect.value];
    if (!a) return;
    const hint = document.getElementById('stockHint');
    if (activeType === 'vente' || activeType === 'perte') {
      hint.innerHTML = `Stock actuel : <strong>${a.qty ?? 0}</strong> — après : <strong>${Math.max(0, (a.qty ?? 0) - (parseInt(qtyInput.value) || 0))}</strong>`;
    } else {
      hint.innerHTML = `Stock actuel : <strong>${a.qty ?? 0}</strong> — après : <strong>${(a.qty ?? 0) + (parseInt(qtyInput.value) || 0)}</strong>`;
    }
  }
  articleSelect.addEventListener('change', updateStockHint);
  qtyInput.addEventListener('input', updateStockHint);
  document.getElementById('qtyMinus').addEventListener('click', () => { qtyInput.value = Math.max(1, (parseInt(qtyInput.value) || 1) - 1); updateStockHint(); });
  document.getElementById('qtyPlus').addEventListener('click', () => { qtyInput.value = (parseInt(qtyInput.value) || 1) + 1; updateStockHint(); });
  updateStockHint();

  document.getElementById('moveForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const articleId = articleSelect.value;
    const qty = parseInt(qtyInput.value) || 0;
    if (!articleId || qty <= 0) return;
    const a = articles[articleId];
    if ((activeType === 'vente' || activeType === 'perte') && qty > (a.qty ?? 0)) {
      toast('Quantité supérieure au stock disponible.');
      return;
    }
    const customerId = (activeType === 'vente' && customerSelect.value) ? customerSelect.value : null;
    const onCredit = activeType === 'vente' && customerId && creditCheckbox.checked;
    submitBtn.disabled = true;
    try {
      // Réassort : toujours en ligne (réservé au gérant, moins urgent à enregistrer immédiatement).
      // Vente à crédit : toujours en ligne aussi — le solde client doit rester fiable,
      // pas d'estimation optimiste hors-ligne pour l'argent dû.
      // Vente au comptant / Perte : tolère l'absence de réseau, mise en file d'attente locale.
      if (activeType === 'reassort' || onCredit) {
        await recordMovement(articleId, activeType, qty, customerId, !!onCredit);
        toast('Mouvement enregistré.');
      } else {
        const wentOffline = await recordMovementTolerant(articleId, activeType, qty, customerId);
        toast(wentOffline ? 'Hors-ligne : vente enregistrée, en attente de synchronisation.' : 'Mouvement enregistré.');
      }
      backdrop.remove();
    } catch (err) {
      console.error(err);
      toast(err.message && err.message.includes('crédit') ? err.message : "Erreur lors de l'enregistrement.");
      submitBtn.disabled = false;
    }
  });
}

function buildWorkbook() {
  const kindWord = { vente: 'Vente', reassort: 'Réassort', perte: 'Casse/Perte', retour: 'Retour' };

  const articleRows = Object.values(articles)
    .sort((a, b) => a.name.localeCompare(b.name, 'fr'))
    .map(a => ({
      'Article': a.name,
      'Catégorie': a.category || '',
      'Quantité en stock': a.qty ?? 0,
      'Prix d\'achat (FCFA)': a.buy_price ?? 0,
      'Prix de vente (FCFA)': a.sell_price ?? 0,
      'Seuil alerte': a.threshold ?? 0,
      'Valeur du stock (FCFA)': (a.qty ?? 0) * (a.buy_price ?? 0),
    }));

  const movementRows = movements
    .slice()
    .sort((a, b) => new Date(b.at) - new Date(a.at))
    .map(m => {
      const art = articles[m.article_id];
      return {
        'Date': m.at ? new Date(m.at).toLocaleString('fr-FR') : '',
        'Article': art ? art.name : '(article supprimé)',
        'Type': kindWord[m.type] || m.type,
        'Quantité': m.qty,
        'Par': m.by_name || 'inconnu',
      };
    });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(articleRows), 'Articles');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(movementRows), 'Mouvements');
  return wb;
}

document.getElementById('exportExcelBtn').addEventListener('click', () => {
  try {
    const wb = buildWorkbook();
    const dateStr = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `boutique-stock-${dateStr}.xlsx`);
  } catch (err) {
    console.error(err);
    toast("Échec de l'export. Réessayez.");
  }
});

// Colonnes attendues dans le fichier (insensible à la casse, variantes tolérées) :
// Nom / Article, Catégorie, Quantité, Prix d'achat, Prix de vente, Seuil alerte
function pickCol(row, candidates) {
  const keys = Object.keys(row);
  for (const cand of candidates) {
    const found = keys.find(k => k.trim().toLowerCase() === cand);
    if (found !== undefined) return row[found];
  }
  return undefined;
}
function toNum(v, fallback) {
  const n = parseFloat(v);
  return isNaN(n) ? fallback : n;
}
function parseImportRows(rawRows) {
  return rawRows.map(row => {
    const name = String(pickCol(row, ['nom', 'article', 'nom de l\'article']) ?? '').trim();
    return {
      name,
      category: String(pickCol(row, ['catégorie', 'categorie']) ?? '').trim(),
      qty: toNum(pickCol(row, ['quantité', 'quantite', 'quantité en stock', 'qty']), 0),
      buy_price: toNum(pickCol(row, ['prix d\'achat', 'prix d\'achat (fcfa)', 'prix achat']), 0),
      sell_price: toNum(pickCol(row, ['prix de vente', 'prix de vente (fcfa)', 'prix vente']), 0),
      threshold: toNum(pickCol(row, ['seuil alerte', 'seuil', 'seuil d\'alerte stock bas']), 3),
    };
  }).filter(r => r.name);
}

function openImportSheet(parsedRows) {
  const byNameLower = {};
  Object.entries(articles).forEach(([id, a]) => { byNameLower[a.name.trim().toLowerCase()] = id; });

  const plan = parsedRows.map(r => {
    const existingId = byNameLower[r.name.toLowerCase()];
    return { ...r, existingId, action: existingId ? 'update' : 'new' };
  });

  const newCount = plan.filter(p => p.action === 'new').length;
  const updateCount = plan.filter(p => p.action === 'update').length;

  const backdrop = document.createElement('div');

  backdrop.innerHTML = `

      <div class="import-summary">${newCount} nouveau(x), ${updateCount} à mettre à jour (quantité, prix et seuil remplacés ; un réassort sera enregistré).</div>
      <div class="import-preview">
        ${plan.map(p => `
          <div class="import-row">
            <span class="iname">${escapeHtml(p.name)}</span>
            <span class="ibadge ${p.action}">${p.action === 'new' ? 'Nouveau' : 'Maj'}</span>
          </div>
        `).join('')}
      </div>
      <button type="button" class="btn btn-primary btn-block" id="confirmImportBtn">Confirmer l'import</button>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
  document.getElementById('closeImportSheet').addEventListener('click', () => backdrop.remove());

  document.getElementById('confirmImportBtn').addEventListener('click', async () => {
    const btn = document.getElementById('confirmImportBtn');
    btn.disabled = true;
    btn.textContent = 'Import en cours…';
    let okCount = 0, failCount = 0;
    for (const p of plan) {
      try {
        if (p.action === 'update') {
          const { error } = await supa.from('articles').update({
            category: p.category, qty: p.qty, buy_price: p.buy_price,
            sell_price: p.sell_price, threshold: p.threshold,
          }).eq('id', p.existingId);
          if (error) throw error;
          if (p.qty > 0) await recordMovement(p.existingId, 'reassort', p.qty);
        } else {
          const { data, error } = await supa.from('articles').insert({
            name: p.name, category: p.category, qty: p.qty,
            buy_price: p.buy_price, sell_price: p.sell_price, threshold: p.threshold,
          }).select('id').single();
          if (error) throw error;
          if (p.qty > 0 && data?.id) await recordMovement(data.id, 'reassort', p.qty);
        }
        okCount++;
      } catch (err) {
        console.error(err);
        failCount++;
      }
    }
    backdrop.remove();
    toast(failCount === 0 ? `${okCount} article(s) importé(s).` : `${okCount} importé(s), ${failCount} échec(s).`);
  });
}

// ---------------------------------------------------------------------------
// Data layer: Supabase
// ---------------------------------------------------------------------------
async function recordMovement(articleId, type, qty, customerId = null, onCredit = false) {
  // Passe par la fonction sécurisée côté serveur : elle revérifie le rôle,
  // met à jour le stock et insère le mouvement de façon atomique. Pour une
  // vente à crédit, elle incrémente aussi le solde dû du client (module 3).
  const { error } = await supa.rpc('record_movement', {
    p_article_id: articleId,
    p_type: type,
    p_qty: qty,
    p_customer_id: customerId,
    p_on_credit: onCredit,
  });
  if (error) throw error;
  markActivity();
}

// ---------------------------------------------------------------------------
// Vente / Perte tolérantes au hors-ligne
// ---------------------------------------------------------------------------
// Tente l'enregistrement en direct ; si le réseau est indisponible (ou l'appel
// échoue pour une raison réseau), le mouvement est mis en file d'attente locale
// et appliqué à l'affichage de façon optimiste (le stock réel sera recalé dès
// la synchronisation). Retourne true si le mouvement est parti en hors-ligne.
async function recordMovementTolerant(articleId, type, qty, customerId = null) {
  if (navigator.onLine) {
    try {
      await recordMovement(articleId, type, qty, customerId, false);
      return false;
    } catch (err) {
      // Si l'erreur ne ressemble pas à un problème réseau (ex: refusé par le serveur), on la relance.
      if (!isLikelyNetworkError(err)) throw err;
    }
  }
  await queueOfflineMovement(articleId, type, qty, customerId);
  return true;
}

function isLikelyNetworkError(err) {
  const msg = String(err?.message || err || '').toLowerCase();
  return !navigator.onLine || msg.includes('fetch') || msg.includes('network') || msg.includes('failed to fetch');
}

async function queueOfflineMovement(articleId, type, qty, customerId = null) {
  markActivity();
  const entry = {
    localId: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    article_id: articleId,
    type,
    qty,
    customer_id: customerId,
    by_name: currentProfile?.display_name || currentProfile?.email || 'inconnu',
    created_at: new Date().toISOString(),
  };
  await addPendingMovement(entry);

  // Mise à jour optimiste de l'affichage local (stock + liste des mouvements),
  // sans attendre la synchronisation.
  const a = articles[articleId];
  if (a) {
    a.qty = (a.qty ?? 0) - qty; // vente/perte retirent toujours du stock
  }
  movements.unshift({
    id: 'pending-' + entry.localId,
    article_id: articleId,
    type,
    qty,
    customer_id: customerId,
    by_name: entry.by_name,
    at: entry.created_at,
    pending: true,
  });
  updatePendingBadge();
  renderAll();
}

async function syncPendingMovements() {
  if (syncInProgress || !navigator.onLine) return;
  syncInProgress = true;
  try {
    const pending = await getPendingMovements();
    if (pending.length === 0) { updatePendingBadge(); return; }
    pending.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    for (const entry of pending) {
      try {
        await recordMovement(entry.article_id, entry.type, entry.qty, entry.customer_id ?? null, false);
        await removePendingMovement(entry.localId);
      } catch (err) {
        console.error('Échec synchronisation mouvement en attente:', err);
        // On s'arrête ici : on réessaiera au prochain déclenchement (reconnexion suivante),
        // pour garder l'ordre des mouvements.
        break;
      }
    }
    // Recharge l'état réel depuis le serveur (corrige toute estimation optimiste,
    // y compris un stock négatif resté affiché le temps de la synchro).
    await loadArticles();
    await loadMovements();
  } finally {
    syncInProgress = false;
    updatePendingBadge();
  }
}

function updatePendingBadge() {
  getPendingMovements().then((pending) => {
    pendingCount = pending.length;
    const el = document.getElementById('pendingBadge');
    if (el) {
      el.hidden = pendingCount === 0;
      el.textContent = pendingCount === 1 ? '1 en attente' : `${pendingCount} en attente`;
    }
  }).catch(() => {});
}

function updateOnlineStatus() {
  const pill = document.getElementById('offlineStatus');
  if (!pill) return;
  pill.hidden = navigator.onLine;
}

window.addEventListener('online', () => { updateOnlineStatus(); syncPendingMovements(); });
window.addEventListener('offline', () => { updateOnlineStatus(); });

const DATA_CACHE_KEY = 'boutique-stock-data-cache';

function cacheData() {
  try {
    localStorage.setItem(DATA_CACHE_KEY, JSON.stringify({ articles, movements }));
  } catch (err) { /* stockage indisponible : tant pis, pas bloquant */ }
}

function readCachedData() {
  try {
    const raw = localStorage.getItem(DATA_CACHE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (err) {
    return null;
  }
}

async function loadArticles() {
  const { data, error } = await supa.from('articles').select('*').order('name');
  if (error) {
    console.error(error);
    if (!navigator.onLine || isLikelyNetworkError(error)) {
      const cached = readCachedData();
      if (cached?.articles && Object.keys(articles).length === 0) {
        articles = cached.articles;
        await reapplyPendingMovements();
        renderAll();
      }
    }
    return;
  }
  articles = {};
  (data || []).forEach(row => {
    articles[row.id] = {
      name: row.name, category: row.category, qty: row.qty,
      buy_price: row.buy_price, sell_price: row.sell_price, threshold: row.threshold,
    };
  });
  await reapplyPendingMovements();
  renderAll();
  cacheData();
}

async function loadMovements() {
  const { data, error } = await supa.from('movements').select('*').order('at', { ascending: false }).limit(200);
  if (error) {
    console.error(error);
    if (!navigator.onLine || isLikelyNetworkError(error)) {
      const cached = readCachedData();
      if (cached?.movements && movements.length === 0) {
        movements = cached.movements;
        await reapplyPendingMovements();
        renderAll();
      }
    }
    return;
  }
  movements = data || [];
  await reapplyPendingMovements();
  renderAll();
  cacheData();
}

async function loadCustomers() {
  const { data, error } = await supa.from('customers').select('*').order('name');
  if (error) {
    console.error(error);
    return;
  }
  customers = {};
  (data || []).forEach(row => {
    customers[row.id] = {
      name: row.name, phone: row.phone, email: row.email, address: row.address,
      segment: row.segment, credit_limit: row.credit_limit, credit_balance: row.credit_balance,
      notes: row.notes,
    };
  });
  renderCustomers();
}

// Réapplique par-dessus l'état serveur les mouvements encore en file d'attente
// locale (pas encore synchronisés), pour que l'affichage reste cohérent même
// si un chargement serveur intervient pendant que l'app est hors-ligne.
async function reapplyPendingMovements() {
  let pending = [];
  try {
    pending = await getPendingMovements();
  } catch (err) {
    console.error(err);
    return;
  }
  if (pending.length === 0) return;
  pending.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  for (const entry of pending) {
    const a = articles[entry.article_id];
    if (a) a.qty = (a.qty ?? 0) - entry.qty;
    const alreadyShown = movements.some((m) => m.id === 'pending-' + entry.localId);
    if (!alreadyShown) {
      movements.unshift({
        id: 'pending-' + entry.localId,
        article_id: entry.article_id,
        type: entry.type,
        qty: entry.qty,
        customer_id: entry.customer_id ?? null,
        by_name: entry.by_name,
        at: entry.created_at,
        pending: true,
      });
    }
  }
}

// ---------------------------------------------------------------------------
// Expiration de session après inactivité (limite le risque en cas de téléphone
// perdu/volé encore connecté : au-delà de 7 jours sans utilisation, on redemande
// le mot de passe, même si le token de session Supabase est encore valide).
// ---------------------------------------------------------------------------
const LAST_ACTIVITY_KEY = 'boutique-stock-last-activity';
const INACTIVITY_LIMIT_MS = 7 * 24 * 60 * 60 * 1000; // 7 jours

function markActivity() {
  try { localStorage.setItem(LAST_ACTIVITY_KEY, String(Date.now())); } catch (err) { /* non bloquant */ }
}

function isSessionExpiredByInactivity() {
  try {
    const last = parseInt(localStorage.getItem(LAST_ACTIVITY_KEY), 10);
    if (!last) return false; // pas d'historique : on laisse passer (première fois)
    return (Date.now() - last) > INACTIVITY_LIMIT_MS;
  } catch (err) {
    return false;
  }
}

const PROFILE_CACHE_KEY = 'boutique-stock-profile-cache';

function cacheProfile(userId, profile) {
  try {
    localStorage.setItem(PROFILE_CACHE_KEY, JSON.stringify({ userId, profile }));
  } catch (err) { /* stockage indisponible : tant pis, pas bloquant */ }
}

function readCachedProfile(userId) {
  try {
    const raw = localStorage.getItem(PROFILE_CACHE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed.userId !== userId) return null;
    return parsed.profile;
  } catch (err) {
    return null;
  }
}

async function loadProfileAndEnter(userId) {
  let { data, error } = await supa.from('profiles').select('*').eq('id', userId).single();

  if (error || !data) {
    // Hors-ligne (ou requête impossible pour raison réseau) : on retombe sur le
    // profil mis en cache lors d'une précédente connexion réussie, plutôt que
    // de déconnecter le vendeur — une coupure réseau n'est pas une erreur de compte.
    if (!navigator.onLine || isLikelyNetworkError(error)) {
      const cached = readCachedProfile(userId);
      if (cached) {
        currentProfile = cached;
        enterAppWithProfile();
        toast('Hors-ligne : connecté avec les dernières informations enregistrées.');
        return;
      }
      // Pas de réseau et aucun profil en cache (toute première connexion) : impossible de continuer.
      document.getElementById('loginError').textContent = 'Pas de connexion internet. La première connexion nécessite une connexion active.';
      showLogin();
      return;
    }
    // En ligne mais vraie erreur (compte sans profil, etc.) : là on déconnecte.
    console.error(error);
    document.getElementById('loginError').textContent = "Votre compte n'a pas de profil associé. Contactez le gérant.";
    await supa.auth.signOut();
    showLogin();
    return;
  }

  // Première connexion après confirmation d'email suite à une inscription :
  // le profil existe (créé par le trigger côté serveur) mais n'a pas encore
  // de boutique — on la crée maintenant avec le nom choisi au moment du signup.
  if (!data.shop_id && pendingShopName) {
    const shopNameToUse = pendingShopName;
    pendingShopName = null;
    try {
      const { error: shopError } = await supa.rpc('create_shop_and_owner', { p_shop_name: shopNameToUse });
      if (shopError) throw shopError;
      const { data: refreshed } = await supa.from('profiles').select('*').eq('id', userId).single();
      if (refreshed) data = refreshed;
    } catch (err) {
      console.error(err);
      toast("Compte connecté, mais la création de la boutique a échoué. Réessayez ou contactez le support.");
    }
  }

  currentProfile = data;
  cacheProfile(userId, data);
  enterAppWithProfile();
}

function subscribeRealtime() {
  if (articlesChannel) return; // déjà abonné
  articlesChannel = supa.channel('public:articles')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'articles' }, loadArticles)
    .subscribe();
  movementsChannel = supa.channel('public:movements')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'movements' }, loadMovements)
    .subscribe();
  customersChannel = supa.channel('public:customers')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'customers' }, loadCustomers)
    .subscribe();
  purchasingChannel = supa.channel('public:purchasing')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'suppliers' }, loadPurchasing)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'purchase_orders' }, loadPurchasing)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'supplier_payments' }, loadPurchasing)
    .subscribe();
  salesDocsChannel = supa.channel('public:sales_documents')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'sales_documents' }, loadSalesDocuments)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'invoice_payments' }, loadSalesDocuments)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'returns' }, () => { loadReturns(); loadSalesDocuments(); })
    .subscribe();
}

function unsubscribeRealtime() {
  if (articlesChannel) { supa.removeChannel(articlesChannel); articlesChannel = null; }
  if (movementsChannel) { supa.removeChannel(movementsChannel); movementsChannel = null; }
  if (customersChannel) { supa.removeChannel(customersChannel); customersChannel = null; }
  if (salesDocsChannel) { supa.removeChannel(salesDocsChannel); salesDocsChannel = null; }
  if (purchasingChannel) { supa.removeChannel(purchasingChannel); purchasingChannel = null; }
}

async function start() {
  showLogin(); // état par défaut pendant qu'on vérifie la session
  if (isSessionExpiredByInactivity()) {
    // Session trop ancienne sans activité : on force une reconnexion par mot de passe,
    // même si le token local est encore techniquement valide (protection en cas de
    // téléphone perdu ou volé resté connecté).
    await supa.auth.signOut();
    document.getElementById('loginError').textContent = 'Session expirée après une longue inactivité. Reconnectez-vous.';
    return;
  }
  const { data } = await supa.auth.getSession();
  if (data.session) {
    await loadProfileAndEnter(data.session.user.id);
  }
}

start();

// ---------------------------------------------------------------------------
// PWA : enregistrement du service worker
// ---------------------------------------------------------------------------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch((err) => {
      console.error('Échec enregistrement service worker:', err);
    });
  });
}
</script>
