<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boutique Stock</title>

<!-- PWA : installation sur l'écran d'accueil -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3c7a52">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boutique Stock">

<style>
/* Polices embarquées localement (dist/fonts/) : fonctionnent dès le premier
   lancement, même sans connexion internet — pas de dépendance à Google Fonts. */
@font-face {
  font-family: 'DM Sans';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/dm-sans-latin-400-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'DM Sans';
  font-style: italic;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/dm-sans-latin-400-italic.woff2') format('woff2');
}
@font-face {
  font-family: 'DM Sans';
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url('fonts/dm-sans-latin-500-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'DM Sans';
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url('fonts/dm-sans-latin-600-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'DM Sans';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url('fonts/dm-sans-latin-700-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'IBM Plex Mono';
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url('fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'IBM Plex Mono';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url('fonts/ibm-plex-mono-latin-700-normal.woff2') format('woff2');
}

:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --surface-sunken: #e9ede8;
  --border: #d7ddd4;
  --ink: #1c231e;
  --ink-dim: #5e6b60;
  --accent: #3c7a52;
  --accent-ink: #ffffff;
  --good: #2f7a4f;
  --good-bg: #e7f2ea;
  --warn: #a8651a;
  --warn-bg: #faf0e2;
  --bad: #b23b3b;
  --bad-bg: #fbeaea;
  --font-display: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171a; --surface: #1d2420; --surface-sunken: #171d19; --border: #2d352f;
    --ink: #eef1ec; --ink-dim: #9aa69c; --accent: #6bb886; --accent-ink: #0f1a13;
    --good: #6fbf8c; --good-bg: #1c2a20; --warn: #e0a858; --warn-bg: #2e2415;
    --bad: #e2807f; --bad-bg: #2e1c1b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171a; --surface: #1d2420; --surface-sunken: #171d19; --border: #2d352f;
  --ink: #eef1ec; --ink-dim: #9aa69c; --accent: #6bb886; --accent-ink: #0f1a13;
  --good: #6fbf8c; --good-bg: #1c2a20; --warn: #e0a858; --warn-bg: #2e2415;
  --bad: #e2807f; --bad-bg: #2e1c1b; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  min-height: 100%;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
button { font: inherit; }
img { max-width: 100%; }

.app-fixed-top {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  margin-inline: -16px; padding-inline: 16px;
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px 14px; }
.brand h1 { font-size: 1.3rem; }
.who { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--ink-dim); flex-wrap: wrap; justify-content: flex-end; }
.who .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: none; }
.who .dot.off { background: var(--bad); }

nav.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-sunken); border-radius: 12px; margin-bottom: 12px; }
nav.tabs button {
  flex: 1; border: none; background: transparent; color: var(--ink-dim);
  padding: 9px 4px; border-radius: 9px; font-size: 0.84rem; font-weight: 600; cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
nav.tabs button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
.fixed-tab-panel { display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }

main { flex: 1; display: flex; flex-direction: column; gap: 16px; padding-bottom: 24px; }
section[hidden] { display: none !important; }
[hidden] { display: none !important; }
.logout-link-top { background: none; border: 1px solid var(--border); color: var(--ink-dim); font-size: 0.72rem; cursor: pointer; padding: 4px 9px; border-radius: 8px; }

.tiles { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .label { font-size: 0.68rem; color: var(--ink-dim); letter-spacing: 0.02em; text-transform: uppercase; }
.tile .value { font-size: 1.15rem; font-weight: 700; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tile .value.small { font-size: 0.95rem; }

.alert-banner { display: flex; align-items: center; gap: 8px; background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 9px 12px; font-size: 0.82rem; font-weight: 600; }

.searchbar { display: flex; gap: 8px; }
.searchbar input[type="search"] { flex: 1; min-width: 0; border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 12px; font-size: 0.9rem; }
.searchbar select { border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 8px; font-size: 0.85rem; max-width: 40%; }

.article-list { display: flex; flex-direction: column; gap: 8px; }
.article-row { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.article-row .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.article-row .name { font-weight: 600; font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.article-row .meta { font-size: 0.75rem; color: var(--ink-dim); }
.article-row .qty { flex: none; text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1rem; min-width: 44px; }
.article-row .qty .unit { font-size: 0.65rem; font-weight: 500; color: var(--ink-dim); display: block; font-family: var(--font-body); }
.article-row .qty.bad { color: var(--bad); }
.article-row .qty.good { color: var(--good); font-size: 0.8rem; }
.stock-pill { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.stock-pill.ok { background: var(--good); }
.stock-pill.low { background: var(--warn); }
.stock-pill.out { background: var(--bad); }

.empty-state { text-align: center; color: var(--ink-dim); padding: 32px 16px; font-size: 0.88rem; }

.btn { border: none; border-radius: 10px; padding: 11px 16px; font-weight: 600; font-size: 0.9rem; cursor: pointer; text-align: center; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--surface-sunken); color: var(--ink); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.fab {
  position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  border: none; font-size: 1.5rem; line-height: 1; box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}

.move-type-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.move-type-btn { border: 1.5px solid var(--border); background: var(--surface); color: var(--ink-dim); border-radius: 10px; padding: 11px 6px; font-size: 0.82rem; font-weight: 700; cursor: pointer; text-align: center; }
.move-type-btn.active[data-type="vente"] { border-color: var(--good); color: var(--good); background: var(--good-bg); }
.move-type-btn.active[data-type="reassort"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.move-type-btn.active[data-type="perte"] { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }

.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 0.76rem; font-weight: 600; color: var(--ink-dim); }
.field select, .field input { border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 0.95rem; width: 100%; }
.qty-stepper { display: flex; align-items: center; gap: 10px; }
.qty-stepper button { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-sunken); color: var(--ink); font-size: 1.2rem; cursor: pointer; flex: none; }
.qty-stepper input { text-align: center; font-family: var(--font-mono); font-weight: 700; font-size: 1.1rem; }
.current-stock-hint { font-size: 0.78rem; color: var(--ink-dim); }
.current-stock-hint strong { color: var(--ink); }

form { display: flex; flex-direction: column; gap: 14px; }
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: flex-end; z-index: 30; }
.sheet { background: var(--bg); width: 100%; max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h2 { font-size: 1.05rem; }
.sheet-close { background: none; border: none; color: var(--ink-dim); font-size: 1.3rem; cursor: pointer; padding: 4px 8px; }

.history-list { display: flex; flex-direction: column; gap: 6px; }
.history-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
.history-row .kind { flex: none; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; }
.history-row .kind.vente { background: var(--good-bg); color: var(--good); }
.history-row .kind.reassort { background: color-mix(in srgb, var(--accent) 15%, var(--surface)); color: var(--accent); }
.history-row .kind.perte { background: var(--bad-bg); color: var(--bad); }
.history-row .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.history-row .info .line1 { font-size: 0.86rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-row .info .line2 { font-size: 0.72rem; color: var(--ink-dim); }
.history-row .amount { flex: none; font-family: var(--font-mono); font-weight: 700; font-size: 0.88rem; }
.history-row .amount.neg { color: var(--bad); }
.history-row .amount.pos { color: var(--good); }

.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; z-index: 50; box-shadow: 0 6px 16px rgba(0,0,0,0.25); }

.role-badge { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
.role-badge.gerant { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); color: var(--accent); }
.role-badge.vendeur { background: var(--good-bg); color: var(--good); }

.import-preview { display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
.import-row { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; padding: 6px 4px; border-bottom: 1px solid var(--border); }
.import-row:last-child { border-bottom: none; }
.import-row .iname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.import-row .ibadge { flex: none; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; padding: 2px 7px; border-radius: 999px; }
.import-row .ibadge.new { background: var(--good-bg); color: var(--good); }
.import-row .ibadge.update { background: color-mix(in srgb, var(--accent) 15%, var(--surface)); color: var(--accent); }
.import-row .ibadge.skip { background: var(--bad-bg); color: var(--bad); }
.import-summary { font-size: 0.82rem; color: var(--ink-dim); }

.status-row { display: flex; gap: 6px; flex-wrap: wrap; }
.status-row:empty { display: none; }
.status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.74rem; font-weight: 600; padding: 4px 9px; border-radius: 999px; margin-bottom: 8px; }
.offline-pill { background: var(--bad-bg); color: var(--bad); }
.offline-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--bad); }
.pending-pill { background: var(--warn-bg); color: var(--warn); }
.history-row.pending { opacity: 0.75; border-style: dashed; }
.history-row .pending-tag { flex: none; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; color: var(--warn); background: var(--warn-bg); padding: 2px 6px; border-radius: 999px; }

.login-screen { flex: 1; display: flex; align-items: center; justify-content: center; padding-block: 24px; }
.login-card { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 14px; }
.login-card h1 { font-size: 1.5rem; text-align: center; }
.login-card .subtitle { text-align: center; color: var(--ink-dim); font-size: 0.85rem; margin-top: -8px; }
.login-error { color: var(--bad); font-size: 0.82rem; min-height: 1.2em; text-align: center; }
.logout-link { background: none; border: none; color: var(--ink-dim); font-size: 0.78rem; cursor: pointer; padding: 4px; text-decoration: underline; }

/* --- Devis & factures --------------------------------------------------- */
.history-row .kind.retour { background: color-mix(in srgb, var(--accent) 15%, var(--surface)); color: var(--accent); }
.doc-badge { display: inline-block; font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; padding: 2px 7px; border-radius: 999px; background: var(--surface-sunken); color: var(--ink-dim); }
.doc-badge.ok { background: var(--good-bg); color: var(--good); }
.doc-badge.warn { background: var(--warn-bg); color: var(--warn); }
.doc-badge.bad { background: var(--bad-bg); color: var(--bad); }
.doc-badge.accent { background: color-mix(in srgb, var(--accent) 15%, var(--surface)); color: var(--accent); }
.article-row .meta .doc-badge { margin-left: 4px; vertical-align: 1px; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field textarea { border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; width: 100%; font-family: inherit; resize: vertical; min-height: 60px; }
.check-line { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; cursor: pointer; }
.check-line input { width: auto; }
.doc-lines { display: flex; flex-direction: column; gap: 10px; }
.doc-line { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.doc-line .full { grid-column: 1 / -1; }
.doc-line select, .doc-line input { border: 1px solid var(--border); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 8px 10px; font-size: 0.88rem; width: 100%; }
.doc-line label { font-size: 0.7rem; font-weight: 600; color: var(--ink-dim); display: flex; flex-direction: column; gap: 3px; }
.doc-line .line-foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; }
.doc-line .line-foot strong { font-family: var(--font-mono); }
.doc-line input[type="checkbox"] { width: auto; flex: none; }
.doc-line .check-line { font-size: 0.8rem; color: var(--ink); }
.doc-line .remove-line { background: none; border: none; color: var(--bad); font-size: 0.8rem; font-weight: 600; cursor: pointer; padding: 2px 4px; }
.doc-totals { background: var(--surface-sunken); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 0.86rem; }
.doc-totals div { display: flex; justify-content: space-between; }
.doc-totals span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.doc-totals .grand { font-weight: 700; font-size: 1rem; border-top: 1px solid var(--border); padding-top: 6px; margin-top: 2px; }
.doc-totals .due { color: var(--bad); font-weight: 700; }
.doc-meta { display: flex; flex-direction: column; gap: 3px; font-size: 0.84rem; color: var(--ink-dim); }
.doc-meta strong { color: var(--ink); }
.doc-view-lines { display: flex; flex-direction: column; gap: 6px; }
.doc-view-line { display: flex; justify-content: space-between; gap: 10px; font-size: 0.86rem; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
.doc-view-line .d { min-width: 0; }
.doc-view-line .d small { display: block; color: var(--ink-dim); font-size: 0.74rem; }
.doc-view-line .t { font-family: var(--font-mono); font-weight: 700; flex: none; }
.fne-note { font-size: 0.76rem; color: var(--ink-dim); background: var(--surface-sunken); border-radius: 10px; padding: 9px 11px; line-height: 1.4; }
.sheet-error { color: var(--bad); font-size: 0.82rem; min-height: 1.1em; }

/* Zone d'impression : invisible à l'écran, seule visible à l'impression */
#printArea { display: none; }
@media print {
  @page { size: A4; margin: 14mm; }
  body > *:not(#printArea) { display: none !important; }
  body { background: #fff !important; padding: 0 !important; }
  #printArea { display: block !important; }
}
.pdoc { color: #111; background: #fff; font-family: var(--font-body); font-size: 10.5pt; line-height: 1.4; }
.pdoc .phead { display: flex; justify-content: space-between; gap: 24px; border-bottom: 2px solid #3c7a52; padding-bottom: 10px; margin-bottom: 14px; }
.pdoc .pshop h1 { font-size: 15pt; margin: 0 0 3px; color: #3c7a52; }
.pdoc .pshop div, .pdoc .pinfo div { font-size: 9pt; color: #333; }
.pdoc .pinfo { text-align: right; }
.pdoc .pinfo .ptitle { font-size: 18pt; font-weight: 700; letter-spacing: 0.04em; color: #111; }
.pdoc .pclient { border: 1px solid #ccc; border-radius: 6px; padding: 8px 10px; margin-bottom: 14px; max-width: 60%; }
.pdoc .pclient .lbl { font-size: 8pt; text-transform: uppercase; color: #666; }
.pdoc table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
.pdoc th { background: #eef4f0; text-align: left; font-size: 8.5pt; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid #bbb; }
.pdoc td { padding: 6px 8px; border-bottom: 1px solid #e3e3e3; vertical-align: top; }
.pdoc td.n, .pdoc th.n { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
.pdoc .ptotals { margin-left: auto; width: 46%; }
.pdoc .ptotals div { display: flex; justify-content: space-between; padding: 3px 0; }
.pdoc .ptotals .grand { font-weight: 700; font-size: 12pt; border-top: 2px solid #111; margin-top: 4px; padding-top: 6px; }
.pdoc .pnotes { margin-top: 14px; font-size: 9pt; }
.pdoc .plegal { margin-top: 18px; font-size: 8pt; color: #555; border-top: 1px solid #ddd; padding-top: 8px; }
.pdoc .pstamp { display: inline-block; border: 2px solid #b23b3b; color: #b23b3b; font-weight: 700; padding: 2px 10px; border-radius: 4px; font-size: 11pt; margin-top: 6px; }
</style>
</head>
<body>

<div class="app-fixed-top" id="fixedTop" hidden>
  <div class="topbar">
    <div class="brand"><h1>Boutique Stock</h1></div>
    <div class="who" id="whoBox">
      <span class="dot off" id="whoDot"></span>

<!-- SDK Supabase -->

<script>
// ============================================================================
// Connexion Supabase
// ============================================================================
const supa = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

// ============================================================================
// File d'attente hors-ligne (IndexedDB)
// ----------------------------------------------------------------------------
// Les ventes et pertes enregistrées sans réseau sont stockées ici le temps
// que la connexion revienne. Le réassort reste réservé au gérant et nécessite
// une connexion (moins urgent, et évite de complexifier la logique de reprise).
// ============================================================================
const OFFLINE_DB_NAME = 'boutique-stock-offline';
const OFFLINE_STORE = 'pending_movements';
let offlineDb = null;

function openOfflineDb() {
  return new Promise((resolve, reject) => {
    if (offlineDb) { resolve(offlineDb); return; }
    const req = indexedDB.open(OFFLINE_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(OFFLINE_STORE)) {
        db.createObjectStore(OFFLINE_STORE, { keyPath: 'localId' });
      }
    };
    req.onsuccess = () => { offlineDb = req.result; resolve(offlineDb); };
    req.onerror = () => reject(req.error);
  });
}

async function addPendingMovement(entry) {
  const db = await openOfflineDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(OFFLINE_STORE, 'readwrite');
    tx.objectStore(OFFLINE_STORE).add(entry);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getPendingMovements() {
  const db = await openOfflineDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(OFFLINE_STORE, 'readonly');
    const req = tx.objectStore(OFFLINE_STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function removePendingMovement(localId) {
  const db = await openOfflineDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(OFFLINE_STORE, 'readwrite');
    tx.objectStore(OFFLINE_STORE).delete(localId);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function timeAgo(ts) {
  if (!ts) return '';
  const diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (diffSec < 60) return "à l'instant";
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return `il y a ${diffMin} min`;
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return `il y a ${diffH} h`;
  const diffD = Math.floor(diffH / 24);
  if (diffD < 30) return `il y a ${diffD} j`;
  return new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let articles = {};   // id -> {name, category, qty, buy_price, sell_price, threshold}
let movements = [];  // [{id, article_id, type, qty, by_name, at}]
let customers = {};  // id -> {name, phone, email, address, segment, credit_limit, credit_balance, notes}
let salesDocs = {};  // id -> document (devis/facture) avec .sales_document_lines et .invoice_payments
let shopInfo = null; // ligne `shops` de la boutique courante (en-tête, TVA)
let salesDocsChannel = null;
let returnsMap = {};  // id -> retour avec .return_lines
let suppliersMap = {};    // id -> fournisseur
let purchaseOrders = {};  // id -> bon de commande avec .purchase_order_lines et .supplier_payments
let purchasingChannel = null;
let currentTab = 'dashboard';
let currentProfile = null; // {role, display_name, email}
let articlesChannel = null;
let movementsChannel = null;
let customersChannel = null;
let pendingCount = 0; // nombre de mouvements en attente de synchronisation (hors-ligne)
let syncInProgress = false;
let pendingShopName = null; // nom choisi à l'inscription, en attente de confirmation d'email

function isGerant() {
  // 'owner' (propriétaire de la boutique) a les mêmes droits que 'gerant'
  // dans l'app actuelle — distinction fine entre les deux réservée aux
  // futurs modules (phase 2+ du cahier des charges).
  return currentProfile && (currentProfile.role === 'gerant' || currentProfile.role === 'owner');
}

function toast(msg) {
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}
function fmtFCFA(n) {
  if (n == null || isNaN(n)) return '—';
  return Math.round(n).toLocaleString('fr-FR') + ' F';
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function stockLevel(a) {
  const qty = a.qty || 0;
  const th = a.threshold ?? 3;
  if (qty <= 0) return 'out';
  if (qty <= th) return 'low';
  return 'ok';
}

// ---------------------------------------------------------------------------
// Tabs
// ---------------------------------------------------------------------------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    ['dashboard', 'stock', 'historique', 'clients', 'ventes', 'achats', 'articles'].forEach(t => {
      document.getElementById('tab-' + t).hidden = (t !== currentTab);
      document.getElementById('fixedPanel-' + t).hidden = (t !== currentTab);
    });
    document.getElementById('fabMove').hidden = (currentTab !== 'stock');
  });
});

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function renderSummary() {
  const list = Object.entries(articles);
  const totalRefs = list.length;
  const totalUnits = list.reduce((s, [, a]) => s + (a.qty || 0), 0);
  const stockValue = list.reduce((s, [, a]) => s + (a.qty || 0) * (a.buy_price || 0), 0);
  const lowStock = list.filter(([, a]) => (a.qty || 0) <= (a.threshold ?? 3) && (a.qty || 0) > 0);
  const outStock = list.filter(([, a]) => (a.qty || 0) <= 0);

  const gerant = isGerant();
  document.getElementById('summaryTiles').innerHTML = `
    <div class="tile"><div class="label">Références</div><div class="value">${totalRefs}</div></div>
    <div class="tile"><div class="label">Unités en stock</div><div class="value">${totalUnits}</div></div>
    ${gerant ? `<div class="tile"><div class="label">Valeur stock</div><div class="value small">${fmtFCFA(stockValue)}</div></div>` : ''}
  `;
  const alertCount = lowStock.length + outStock.length;
  document.getElementById('alertBanner').innerHTML = alertCount > 0
    ? `<div class="alert-banner">⚠ ${outStock.length} article(s) épuisé(s), ${lowStock.length} en stock bas</div>`
    : '';
}

function populateCategoryFilter() {
  const sel = document.getElementById('categoryFilter');
  const cats = [...new Set(Object.values(articles).map(a => a.category).filter(Boolean))].sort();
  const current = sel.value;
  sel.innerHTML = '<option value="">Toutes catégories</option>' + cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  sel.value = current;
}

function renderArticleList() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const cat = document.getElementById('categoryFilter').value;
  const list = Object.entries(articles)
    .filter(([, a]) => !search || a.name.toLowerCase().includes(search))
    .filter(([, a]) => !cat || a.category === cat)
    .sort((a, b) => a[1].name.localeCompare(b[1].name, 'fr'));

  const host = document.getElementById('articleList');
  if (list.length === 0) {
    host.innerHTML = `<div class="empty-state">${Object.keys(articles).length === 0 ? "Aucun article pour l'instant. Ajoutez-en dans l'onglet Articles." : "Aucun résultat."}</div>`;
    return;
  }
  host.innerHTML = list.map(([id, a]) => `
    <div class="article-row" data-id="${id}">
      <span class="stock-pill ${stockLevel(a)}"></span>
      <div class="info">
        <div class="name">${escapeHtml(a.name)}</div>
        <div class="meta">${escapeHtml(a.category || 'Sans catégorie')} · ${fmtFCFA(a.sell_price)}</div>
      </div>
      <div class="qty">${a.qty ?? 0}<span class="unit">unités</span></div>
    </div>
  `).join('');
  host.querySelectorAll('.article-row').forEach(row => {
    row.addEventListener('click', () => openMoveSheet(row.dataset.id));
  });
}

function renderHistory() {
  const filter = document.getElementById('historyFilter').value;
  const list = movements.filter(m => !filter || m.type === filter).slice(0, 100);

  const host = document.getElementById('historyList');
  if (list.length === 0) {
    host.innerHTML = `<div class="empty-state">Aucun mouvement enregistré.</div>`;
    return;
  }
  const kindLabel = { vente: 'V', reassort: 'R', perte: 'P', retour: 'T' };
  const kindWord = { vente: 'Vente', reassort: 'Réassort', perte: 'Casse/Perte', retour: 'Retour' };
  host.innerHTML = list.map(m => {
    const art = articles[m.article_id];
    const name = art ? art.name : '(article supprimé)';
    const sign = (m.type === 'reassort' || m.type === 'retour') ? '+' : '−';
    const cls = (m.type === 'reassort' || m.type === 'retour') ? 'pos' : 'neg';
    const when = m.at ? timeAgo(new Date(m.at).getTime()) : '';
    return `
      <div class="history-row ${m.pending ? 'pending' : ''}">
        <div class="kind ${m.type}">${kindLabel[m.type] || '?'}</div>
        <div class="info">
          <div class="line1">${escapeHtml(name)}</div>
          <div class="line2">${kindWord[m.type] || m.type} · ${escapeHtml(m.by_name || 'inconnu')} · ${when}</div>
        </div>
        ${m.pending ? '<span class="pending-tag">En attente</span>' : ''}
        <div class="amount ${cls}">${sign}${m.qty}</div>
      </div>
    `;
  }).join('');
}

function renderArticlesManage() {
  const host = document.getElementById('articlesManageList');
  const list = Object.entries(articles).sort((a, b) => a[1].name.localeCompare(b[1].name, 'fr'));
  if (list.length === 0) {
    host.innerHTML = `<div class="empty-state">Aucun article. Ajoutez le premier ci-dessus.</div>`;
    return;
  }
  host.innerHTML = list.map(([id, a]) => {
    const margin = (a.sell_price || 0) - (a.buy_price || 0);
    return `
    <div class="article-row" data-id="${id}">
      <div class="info">
        <div class="name">${escapeHtml(a.name)}</div>
        <div class="meta">${escapeHtml(a.category || 'Sans catégorie')} · Achat ${fmtFCFA(a.buy_price)} · Vente ${fmtFCFA(a.sell_price)} · Marge ${fmtFCFA(margin)}</div>
      </div>
      <div class="qty">${a.qty ?? 0}<span class="unit">unités</span></div>
    </div>`;
  }).join('');
  host.querySelectorAll('.article-row').forEach(row => {
    row.addEventListener('click', () => openArticleSheet(row.dataset.id));
  });
}

function renderAll() {
  populateCategoryFilter();
  renderSummary();
  renderArticleList();
  renderHistory();
  renderArticlesManage();
  renderCustomers();
  renderSalesDocs();
  renderPurchasing();
  renderDashboard();
}

// ---------------------------------------------------------------------------
// Clients (module 3 — fiche, compte crédit, historique)
// ---------------------------------------------------------------------------
function renderCustomers() {
  const host = document.getElementById('customerList');
  if (!host) return;
  const search = (document.getElementById('customerSearchInput')?.value || '').trim().toLowerCase();
  let list = Object.entries(customers).sort((a, b) => a[1].name.localeCompare(b[1].name, 'fr'));
  if (search) {
    list = list.filter(([, c]) =>
      c.name.toLowerCase().includes(search) ||
      (c.phone || '').toLowerCase().includes(search)
    );
  }
  if (list.length === 0) {
    host.innerHTML = `<div class="empty-state">${search ? 'Aucun client trouvé.' : 'Aucun client. Ajoutez le premier ci-dessus.'}</div>`;
    return;
  }
  host.innerHTML = list.map(([id, c]) => {
    const due = (Number(c.credit_balance) || 0) + customerInvoiceDue(id);
    const dueClass = due > 0 ? 'bad' : 'good';
    return `
    <div class="article-row" data-id="${id}">
      <div class="info">
        <div class="name">${escapeHtml(c.name)}</div>
        <div class="meta">${escapeHtml(c.phone || 'Pas de téléphone')}${c.segment ? ' · ' + escapeHtml(c.segment) : ''}</div>
      </div>
      <div class="qty ${dueClass}">${due > 0 ? fmtFCFA(due) : 'À jour'}${due > 0 ? '<span class="unit">dû</span>' : ''}</div>
    </div>`;
  }).join('');
  host.querySelectorAll('.article-row').forEach(row => {
    row.addEventListener('click', () => openCustomerSheet(row.dataset.id));
  });
}
document.getElementById('customerSearchInput')?.addEventListener('input', renderCustomers);

function customerHistory(customerId) {
  return movements
    .filter(m => m.customer_id === customerId)
    .slice()
    .sort((a, b) => new Date(b.at) - new Date(a.at))
    .slice(0, 20);
}

function openCustomerSheet(id) {
  const existing = id ? customers[id] : null;
  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  const history = existing ? customerHistory(id) : [];
  const typeWord = { vente: 'Vente', reassort: 'Réassort', perte: 'Casse/Perte', retour: 'Retour' };
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheet-head"><h2>${existing ? 'Modifier le client' : 'Nouveau client'}</h2><button class="sheet-close" id="closeCustSheet">✕</button></div>
      <form id="customerForm">
        <div class="field"><label for="custName">Nom</label><input id="custName" required value="${existing ? escapeHtml(existing.name) : ''}" placeholder="Ex : Mme Koné"></div>
        <div class="field"><label for="custPhone">Téléphone</label><input id="custPhone" value="${existing ? escapeHtml(existing.phone || '') : ''}" placeholder="Ex : 07 00 00 00 00"></div>
        <div class="field"><label for="custEmail">Email</label><input id="custEmail" type="email" value="${existing ? escapeHtml(existing.email || '') : ''}"></div>
        <div class="field"><label for="custAddress">Adresse</label><input id="custAddress" value="${existing ? escapeHtml(existing.address || '') : ''}"></div>
        <div class="field"><label for="custSegment">Segment</label><input id="custSegment" value="${existing ? escapeHtml(existing.segment || '') : ''}" placeholder="Ex : Fidèle, Grossiste"></div>
        <div class="field"><label for="custCreditLimit">Plafond de crédit autorisé (FCFA)</label><input id="custCreditLimit" type="number" min="0" inputmode="numeric" value="${existing ? (existing.credit_limit ?? 0) : 0}"></div>
        <div class="field"><label for="custNotes">Notes</label><input id="custNotes" value="${existing ? escapeHtml(existing.notes || '') : ''}"></div>
        ${existing ? `<div class="current-stock-hint">Crédit comptoir dû : <strong>${fmtFCFA(existing.credit_balance || 0)}</strong>${customerInvoiceDue(id) > 0 ? ` · Factures impayées : <strong>${fmtFCFA(customerInvoiceDue(id))}</strong> (à régler depuis l'onglet Devis &amp; Factures)` : ''}</div>` : ''}
        <button type="submit" class="btn btn-primary btn-block">${existing ? 'Enregistrer' : 'Ajouter le client'}</button>
        ${existing && (existing.credit_balance || 0) > 0 ? '<button type="button" class="btn btn-ghost btn-block" id="recordPaymentBtn">Enregistrer un paiement</button>' : ''}
        ${existing && isGerant() ? '<button type="button" class="btn btn-ghost btn-block" id="deleteCustBtn">Supprimer le client</button>' : ''}
      </form>
      ${existing ? `
        <h3 style="margin-top:16px">Historique récent</h3>
        <div class="history-list">
          ${history.length === 0
            ? '<div class="empty-state">Aucun achat enregistré pour ce client.</div>'
            : history.map(m => {
                const a = articles[m.article_id];
                return `<div class="history-row">
                  <div class="info">
                    <div class="line1">${escapeHtml(a?.name || 'Article supprimé')}</div>
                    <div class="line2">${typeWord[m.type] || m.type} · ${new Date(m.at).toLocaleDateString('fr-FR')}</div>
                  </div>
                  <div class="amount neg">${m.qty}</div>
                </div>`;
              }).join('')}
        </div>
      ` : ''}
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
  document.getElementById('closeCustSheet').addEventListener('click', () => backdrop.remove());

  document.getElementById('customerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      name: document.getElementById('custName').value.trim(),
      phone: document.getElementById('custPhone').value.trim() || null,
      email: document.getElementById('custEmail').value.trim() || null,
      address: document.getElementById('custAddress').value.trim() || null,
      segment: document.getElementById('custSegment').value.trim() || null,
      credit_limit: parseFloat(document.getElementById('custCreditLimit').value) || 0,
      notes: document.getElementById('custNotes').value.trim() || null,
    };
    if (!payload.name) return;
    try {
      if (existing) {
        const { error } = await supa.from('customers').update(payload).eq('id', id);
        if (error) throw error;
      } else {
        // shop_id est obligatoire en base : on le fournit explicitement à la
        // création (RLS vérifiera quand même qu'il correspond bien à la
        // boutique de l'utilisateur connecté).
        const { error } = await supa.from('customers').insert({ ...payload, shop_id: currentProfile.shop_id });
        if (error) throw error;
      }
      backdrop.remove();
      toast('Client enregistré.');
      await loadCustomers();
    } catch (err) {
      console.error(err);
      toast(err.message ? `Erreur : ${err.message}` : "Erreur lors de l'enregistrement.");
    }
  });

  if (existing) {
    document.getElementById('recordPaymentBtn')?.addEventListener('click', () => {
      const due = Number(existing.credit_balance) || 0;
      backdrop.remove();
      openFormSheet({
        title: 'Paiement sur crédit comptoir',
        intro: `${escapeHtml(existing.name)} — crédit dû : <strong>${fmtFCFA(due)}</strong>`,
        fields: [{ id: 'amount', type: 'number', label: 'Montant reçu (FCFA)', value: due, min: 1, step: 1, required: true }],
        submitLabel: 'Enregistrer le paiement',
        onSubmit: async (v) => {
          const amount = Number(v.amount);
          if (!(amount > 0)) throw new Error('Montant invalide.');
          const { error } = await supa.rpc('record_customer_payment', { p_customer_id: id, p_amount: amount });
          if (error) throw error;
          await loadCustomers();
          toast('Paiement enregistré.');
        },
      });
    });
    document.getElementById('deleteCustBtn')?.addEventListener('click', async () => {
      try {
        const { error } = await supa.from('customers').delete().eq('id', id);
        if (error) throw error;
        backdrop.remove();
        toast('Client supprimé.');
        await loadCustomers();
      } catch (err) {
        console.error(err);
        toast('Erreur lors de la suppression.');
      }
    });
  }
}
document.getElementById('addCustomerBtn')?.addEventListener('click', () => openCustomerSheet(null));

// ---------------------------------------------------------------------------
// Formulaire générique en feuille (remplace prompt(), peu fiable dans la
// fenêtre de bureau). fields : [{id, label, type, value, options, required,
// min, step, placeholder, hint}] ; onSubmit(values) peut lever une erreur,
// affichée dans la feuille sans la fermer.
// ---------------------------------------------------------------------------
function openFormSheet({ title, intro, fields, submitLabel, onSubmit }) {
  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  const fieldHtml = fields.map(f => {
    if (f.type === 'select') {
      return `<div class="field"><label for="ff_${f.id}">${f.label}</label>
        <select id="ff_${f.id}">${f.options.map(o => `<option value="${escapeHtml(o.value)}" ${String(o.value) === String(f.value ?? '') ? 'selected' : ''}>${escapeHtml(o.label)}</option>`).join('')}</select></div>`;
    }
    if (f.type === 'checkbox') {
      return `<label class="check-line"><input type="checkbox" id="ff_${f.id}" ${f.value ? 'checked' : ''}> ${f.label}</label>`;
    }
    if (f.type === 'textarea') {
      return `<div class="field"><label for="ff_${f.id}">${f.label}</label><textarea id="ff_${f.id}" placeholder="${escapeHtml(f.placeholder || '')}">${escapeHtml(f.value ?? '')}</textarea></div>`;
    }
    return `<div class="field"><label for="ff_${f.id}">${f.label}</label>
      <input id="ff_${f.id}" type="${f.type || 'text'}" value="${escapeHtml(f.value ?? '')}" ${f.required ? 'required' : ''}
        ${f.min != null ? `min="${f.min}"` : ''} ${f.step != null ? `step="${f.step}"` : ''} ${f.type === 'number' ? 'inputmode="decimal"' : ''}
        placeholder="${escapeHtml(f.placeholder || '')}">
      ${f.hint ? `<div class="current-stock-hint">${f.hint}</div>` : ''}</div>`;
  }).join('');
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheet-head"><h2>${escapeHtml(title)}</h2><button class="sheet-close" type="button">✕</button></div>
      ${intro ? `<div class="current-stock-hint">${intro}</div>` : ''}
      <form>
        ${fieldHtml}
        <p class="sheet-error"></p>
        <button type="submit" class="btn btn-primary btn-block">${escapeHtml(submitLabel || 'Valider')}</button>
      </form>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  backdrop.querySelector('.sheet-close').addEventListener('click', close);
  const form = backdrop.querySelector('form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const values = {};
    fields.forEach(f => {
      const el = document.getElementById('ff_' + f.id);
      values[f.id] = f.type === 'checkbox' ? el.checked : el.value;
    });
    const btn = form.querySelector('button[type="submit"]');
    const errEl = form.querySelector('.sheet-error');
    errEl.textContent = '';
    btn.disabled = true;
    try {
      await onSubmit(values);
      close();
    } catch (err) {
      console.error(err);
      errEl.textContent = err.message || 'Erreur.';
      btn.disabled = false;
    }
  });
  return backdrop;
}

// ---------------------------------------------------------------------------
// Devis & factures (module 2)
//
// Les factures produites ici sont des documents de gestion. En Côte d'Ivoire
// la facture fiscalement opposable est la Facture Normalisée Électronique
// (FNE), validée par la DGI (QR code, sceau, numéro fiscal) : l'app permet
// d'y rattacher le numéro FNE, et le document imprimé le précise.
// ---------------------------------------------------------------------------
const DOC_STATUS = {
  en_attente: { label: 'En attente', cls: 'warn' },
  accepte:    { label: 'Accepté', cls: 'ok' },
  refuse:     { label: 'Refusé', cls: 'bad' },
  converti:   { label: 'Converti', cls: 'accent' },
  brouillon:  { label: 'Brouillon', cls: '' },
  emise:      { label: 'Émise', cls: 'accent' },
  annulee:    { label: 'Annulée', cls: 'bad' },
};
const PAY_STATUS = {
  paye:    { label: 'Payée', cls: 'ok' },
  partiel: { label: 'Paiement partiel', cls: 'warn' },
  impaye:  { label: 'Impayée', cls: 'bad' },
};
const PAY_METHODS = {
  especes: 'Espèces', orange_money: 'Orange Money', mtn_money: 'MTN MoMo', moov_money: 'Moov Money',
  wave: 'Wave', banque: 'Virement bancaire', cheque: 'Chèque', autre: 'Autre',
};
const TAX_REGIMES = ['', 'RNI', 'RSI', 'RME', 'TEE / TCE', 'Autre'];

function canManageInvoices() {
  return currentProfile && ['owner', 'gerant', 'comptable'].includes(currentProfile.role);
}
function invoiceRemaining(d) {
  return Math.max(0, (Number(d.total_ttc) || 0) - (Number(d.amount_paid) || 0) - (Number(d.credited_amount) || 0));
}
function paymentStatus(d) {
  if (d.doc_type !== 'facture' || d.status !== 'emise') return null;
  if (invoiceRemaining(d) <= 0) return 'paye';
  return (Number(d.amount_paid) || 0) > 0 ? 'partiel' : 'impaye';
}
function docLabel(d) {
  if (d.number) return d.number;
  return d.doc_type === 'facture' ? 'Facture (brouillon)' : 'Devis';
}
function docBadges(d) {
  const st = DOC_STATUS[d.status] || { label: d.status, cls: '' };
  const pay = paymentStatus(d);
  let html = `<span class="doc-badge ${st.cls}">${st.label}</span>`;
  if (pay) html += ` <span class="doc-badge ${PAY_STATUS[pay].cls}">${PAY_STATUS[pay].label}</span>`;
  if (d.doc_type === 'facture' && d.status === 'emise' && d.fne_number) html += ` <span class="doc-badge ok">FNE</span>`;
  return html;
}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s.length === 10 ? s + 'T00:00:00' : s);
  return d.toLocaleDateString('fr-FR');
}
// Même règle de calcul que la base (recompute_document_totals) : prix TTC,
// HT déduit sur le total pour éviter les écarts d'arrondi.
function computeTotals(lines, vatApplicable, vatRate) {
  const ttc = lines.reduce((s, l) => s + Math.round((Number(l.qty) || 0) * (Number(l.unit_price_ttc) || 0)), 0);
  const ht = (vatApplicable && vatRate > 0) ? Math.round(ttc / (1 + vatRate / 100)) : ttc;
  return { ttc, ht, vat: ttc - ht };
}
function customerInvoiceDue(customerId) {
  return Object.values(salesDocs)
    .filter(d => d.customer_id === customerId && d.doc_type === 'facture' && d.status === 'emise')
    .reduce((s, d) => s + invoiceRemaining(d), 0);
}

async function loadShopInfo() {
  if (!currentProfile?.shop_id) return;
  const { data, error } = await supa.from('shops').select('*').eq('id', currentProfile.shop_id).single();
  if (error) { console.error(error); return; }
  shopInfo = data;
}

async function loadSalesDocuments() {
  const { data, error } = await supa
    .from('sales_documents')
    .select('*, sales_document_lines(*), invoice_payments(*)')
    .order('created_at', { ascending: false })
    .limit(500);
  if (error) { console.error(error); return; }
  salesDocs = {};
  (data || []).forEach(d => {
    d.sales_document_lines = (d.sales_document_lines || []).slice().sort((a, b) => a.position - b.position);
    d.invoice_payments = (d.invoice_payments || []).slice().sort((a, b) => new Date(a.paid_at) - new Date(b.paid_at));
    salesDocs[d.id] = d;
  });
  renderSalesDocs();
  renderCustomers();
  renderDashboard();
}

function renderSalesDocs() {
  const host = document.getElementById('docList');
  if (!host) return;
  const filter = document.getElementById('docFilter')?.value || '';
  const search = (document.getElementById('docSearchInput')?.value || '').trim().toLowerCase();

  let docs = filter === 'retours' ? [] : Object.entries(salesDocs);
  if (filter === 'devis' || filter === 'facture') docs = docs.filter(([, d]) => d.doc_type === filter);
  if (filter === 'impayees') docs = docs.filter(([, d]) => ['impaye', 'partiel'].includes(paymentStatus(d)));
  if (filter === 'brouillons') docs = docs.filter(([, d]) => d.status === 'brouillon');
  let rets = (filter === '' || filter === 'retours') ? Object.entries(returnsMap) : [];
  if (search) {
    const match = (...vals) => vals.some(v => (v || '').toLowerCase().includes(search));
    docs = docs.filter(([, d]) => match(d.number, d.customer_name, d.fne_number));
    rets = rets.filter(([, r]) => match(r.number, r.customer_name, r.fne_number, salesDocs[r.source_document_id]?.number));
  }

  const rows = [
    ...docs.map(([id, d]) => ({ kind: 'doc', id, at: d.created_at, d })),
    ...rets.map(([id, r]) => ({ kind: 'ret', id, at: r.created_at, r })),
  ].sort((a, b) => new Date(b.at) - new Date(a.at));

  if (rows.length === 0) {
    host.innerHTML = `<div class="empty-state">${Object.keys(salesDocs).length + Object.keys(returnsMap).length === 0
      ? 'Aucun devis, facture ni retour. Créez le premier ci-dessus.'
      : 'Aucun document ne correspond.'}</div>`;
    return;
  }
  host.innerHTML = rows.map(row => {
    if (row.kind === 'ret') {
      const r = row.r;
      const src = salesDocs[r.source_document_id];
      return `
        <div class="article-row" data-kind="ret" data-id="${row.id}">
          <div class="info">
            <div class="name">${escapeHtml(r.number)}</div>
            <div class="meta">${escapeHtml(r.customer_name || 'Client non renseigné')} · ${fmtDate(r.return_date)}${src ? ' · ' + escapeHtml(src.number || '') : ''}
              <span class="doc-badge accent">Retour</span> <span class="doc-badge">${RETURN_REASONS[r.reason_category] || r.reason_category}</span></div>
          </div>
          <div class="qty">${fmtFCFA(r.refund_amount > 0 ? r.refund_amount : r.total_ttc)}<span class="unit">${REFUND_SHORT[r.refund_type] || ''}</span></div>
        </div>`;
    }
    const d = row.d;
    const pay = paymentStatus(d);
    const right = pay && pay !== 'paye'
      ? `<div class="qty bad">${fmtFCFA(invoiceRemaining(d))}<span class="unit">reste dû</span></div>`
      : `<div class="qty">${fmtFCFA(d.total_ttc)}<span class="unit">${d.doc_type === 'devis' ? 'devis' : 'TTC'}</span></div>`;
    return `
      <div class="article-row" data-kind="doc" data-id="${row.id}">
        <div class="info">
          <div class="name">${escapeHtml(docLabel(d))}</div>
          <div class="meta">${escapeHtml(d.customer_name || 'Client non renseigné')} · ${fmtDate(d.issue_date || d.created_at)} ${docBadges(d)}</div>
        </div>
        ${right}
      </div>`;
  }).join('');
  host.querySelectorAll('.article-row').forEach(el => {
    el.addEventListener('click', () => el.dataset.kind === 'ret' ? openReturnView(el.dataset.id) : openDocumentView(el.dataset.id));
  });
}
document.getElementById('docFilter')?.addEventListener('change', renderSalesDocs);
document.getElementById('docSearchInput')?.addEventListener('input', renderSalesDocs);

// ---- Éditeur (création / modification d'un devis ou d'une facture brouillon)
function openDocumentEditor(docType, id = null) {
  const existing = id ? salesDocs[id] : null;
  const vatApplicable = shopInfo ? shopInfo.vat_applicable !== false : true;
  const vatRate = shopInfo ? Number(shopInfo.vat_rate ?? 18) : 18;
  let lines = existing
    ? existing.sales_document_lines.map(l => ({ article_id: l.article_id || '', description: l.description, qty: l.qty, unit_price_ttc: Number(l.unit_price_ttc) }))
    : [{ article_id: '', description: '', qty: 1, unit_price_ttc: '' }];

  const articleOptions = Object.entries(articles)
    .sort((a, b) => a[1].name.localeCompare(b[1].name, 'fr'))
    .map(([aid, a]) => `<option value="${aid}">${escapeHtml(a.name)} (${a.qty ?? 0} en stock)</option>`).join('');
  const customerOptions = Object.entries(customers)
    .sort((a, b) => a[1].name.localeCompare(b[1].name, 'fr'))
    .map(([cid, c]) => `<option value="${cid}" ${existing?.customer_id === cid ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('');

  const isQuote = docType === 'devis';
  const title = existing ? `Modifier ${isQuote ? 'le devis' : 'la facture'}` : (isQuote ? 'Nouveau devis' : 'Nouvelle facture');
  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheet-head"><h2>${title}</h2><button class="sheet-close" type="button">✕</button></div>
      <form id="docEditorForm">
        <div class="field">
          <label for="docCustomer">Client</label>
          <select id="docCustomer"><option value="">— Client non enregistré —</option>${customerOptions}</select>
        </div>
        <div class="field" id="docCustomerNameField">
          <label for="docCustomerName">Nom du client (facultatif)</label>
          <input id="docCustomerName" value="${escapeHtml(existing && !existing.customer_id ? existing.customer_name || '' : '')}" placeholder="Ex : Client comptoir">
        </div>
        <div class="doc-lines" id="docLines"></div>
        <button type="button" class="btn btn-ghost btn-block" id="addDocLineBtn">+ Ajouter une ligne</button>
        <div class="doc-totals" id="docTotals"></div>
        ${isQuote
          ? `<div class="field"><label for="docValidUntil">Valable jusqu'au</label><input id="docValidUntil" type="date" value="${existing?.valid_until || ''}"></div>`
          : `<div class="field"><label for="docDueDate">Date d'échéance (facultatif)</label><input id="docDueDate" type="date" value="${existing?.due_date || ''}"></div>`}
        <div class="field"><label for="docNotes">Notes (imprimées sur le document)</label><textarea id="docNotes" placeholder="Ex : Livraison incluse, garantie 6 mois">${escapeHtml(existing?.notes || '')}</textarea></div>
        ${!isQuote ? `<label class="check-line"><input type="checkbox" id="docApplyStock" checked> Sortir les articles du stock à l'émission</label>
          <div class="current-stock-hint">Décochez si ces ventes ont déjà été enregistrées au comptoir (évite de compter le stock deux fois).</div>` : ''}
        <p class="sheet-error" id="docEditorError"></p>
        <button type="submit" class="btn btn-primary btn-block" data-action="save">${isQuote ? 'Enregistrer le devis' : 'Enregistrer le brouillon'}</button>
        ${!isQuote ? '<button type="button" class="btn btn-ghost btn-block" id="docSaveIssueBtn">Enregistrer et émettre la facture</button>' : ''}
      </form>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  backdrop.querySelector('.sheet-close').addEventListener('click', close);

  const customerSelect = document.getElementById('docCustomer');
  const customerNameField = document.getElementById('docCustomerNameField');
  function syncCustomerField() { customerNameField.hidden = !!customerSelect.value; }
  customerSelect.addEventListener('change', syncCustomerField);
  syncCustomerField();

  function renderTotals() {
    const t = computeTotals(lines, vatApplicable, vatRate);
    document.getElementById('docTotals').innerHTML = vatApplicable
      ? `<div><span>Total HT</span><span>${fmtFCFA(t.ht)}</span></div>
         <div><span>TVA ${vatRate} %</span><span>${fmtFCFA(t.vat)}</span></div>
         <div class="grand"><span>Total TTC</span><span>${fmtFCFA(t.ttc)}</span></div>`
      : `<div class="grand"><span>Total (TVA non applicable)</span><span>${fmtFCFA(t.ttc)}</span></div>`;
  }

  function renderLines() {
    const host = document.getElementById('docLines');
    host.innerHTML = lines.map((l, i) => `
      <div class="doc-line" data-idx="${i}">
        <label class="full">Article
          <select data-f="article_id"><option value="">— Ligne libre (service, article hors stock) —</option>${articleOptions}</select>
        </label>
        <label class="full">Désignation
          <input data-f="description" value="${escapeHtml(l.description)}" placeholder="Désignation">
        </label>
        <label>Quantité<input data-f="qty" type="number" min="1" step="1" inputmode="numeric" value="${l.qty}"></label>
        <label>Prix unitaire TTC<input data-f="unit_price_ttc" type="number" min="0" step="1" inputmode="numeric" value="${l.unit_price_ttc}"></label>
        <div class="line-foot">
          <button type="button" class="remove-line" ${lines.length === 1 ? 'hidden' : ''}>Retirer la ligne</button>
          <strong data-total>${fmtFCFA(Math.round((Number(l.qty) || 0) * (Number(l.unit_price_ttc) || 0)))}</strong>
        </div>
      </div>`).join('');
    host.querySelectorAll('.doc-line').forEach(row => {
      const i = Number(row.dataset.idx);
      const sel = row.querySelector('[data-f="article_id"]');
      sel.value = lines[i].article_id || '';
      const desc = row.querySelector('[data-f="description"]');
      const qty = row.querySelector('[data-f="qty"]');
      const price = row.querySelector('[data-f="unit_price_ttc"]');
      const refreshLineTotal = () => {
        row.querySelector('[data-total]').textContent = fmtFCFA(Math.round((Number(lines[i].qty) || 0) * (Number(lines[i].unit_price_ttc) || 0)));
        renderTotals();
      };
      sel.addEventListener('change', () => {
        lines[i].article_id = sel.value;
        const a = articles[sel.value];
        if (a) {
          lines[i].description = a.name;
          lines[i].unit_price_ttc = Number(a.sell_price) || 0;
          desc.value = lines[i].description;
          price.value = lines[i].unit_price_ttc;
        }
        refreshLineTotal();
      });
      desc.addEventListener('input', () => { lines[i].description = desc.value; });
      qty.addEventListener('input', () => { lines[i].qty = qty.value; refreshLineTotal(); });
      price.addEventListener('input', () => { lines[i].unit_price_ttc = price.value; refreshLineTotal(); });
      row.querySelector('.remove-line').addEventListener('click', () => {
        lines.splice(i, 1);
        renderLines();
      });
    });
    renderTotals();
  }
  renderLines();

  document.getElementById('addDocLineBtn').addEventListener('click', () => {
    lines.push({ article_id: '', description: '', qty: 1, unit_price_ttc: '' });
    renderLines();
    const rows = document.querySelectorAll('#docLines .doc-line');
    rows[rows.length - 1]?.scrollIntoView({ block: 'nearest' });
  });

  async function save(andIssue) {
    const errEl = document.getElementById('docEditorError');
    errEl.textContent = '';
    const cleaned = lines
      .filter(l => l.article_id || String(l.description).trim())
      .map(l => ({
        article_id: l.article_id || null,
        description: String(l.description || '').trim(),
        qty: parseInt(l.qty, 10),
        unit_price_ttc: Number(l.unit_price_ttc),
      }));
    if (cleaned.length === 0) { errEl.textContent = 'Ajoutez au moins une ligne.'; return; }
    if (cleaned.some(l => !(l.qty > 0))) { errEl.textContent = 'Chaque ligne doit avoir une quantité d\'au moins 1.'; return; }
    if (cleaned.some(l => !(l.unit_price_ttc >= 0) || String(l.unit_price_ttc) === 'NaN')) { errEl.textContent = 'Chaque ligne doit avoir un prix.'; return; }
    if (!navigator.onLine) { errEl.textContent = 'Les devis et factures nécessitent une connexion internet.'; return; }

    const buttons = backdrop.querySelectorAll('button');
    buttons.forEach(b => b.disabled = true);
    try {
      const { data: docId, error } = await supa.rpc('save_sales_document', {
        p_id: existing ? id : null,
        p_doc_type: docType,
        p_customer_id: customerSelect.value || null,
        p_customer_name: customerSelect.value ? null : document.getElementById('docCustomerName').value,
        p_lines: cleaned,
        p_notes: document.getElementById('docNotes').value,
        p_valid_until: isQuote ? (document.getElementById('docValidUntil').value || null) : null,
        p_due_date: !isQuote ? (document.getElementById('docDueDate').value || null) : null,
      });
      if (error) throw error;
      let number = null;
      if (andIssue) {
        const applyStock = document.getElementById('docApplyStock').checked;
        const { data, error: issueError } = await supa.rpc('issue_invoice', { p_id: docId, p_apply_stock: applyStock });
        if (issueError) {
          // Le brouillon est bien enregistré : on recharge pour qu'il apparaisse.
          await loadSalesDocuments();
          throw new Error(`Brouillon enregistré, mais émission impossible : ${issueError.message}`);
        }
        number = data;
      }
      markActivity();
      await loadSalesDocuments();
      if (andIssue) { loadArticles(); loadMovements(); }
      close();
      toast(number ? `Facture ${number} émise.` : (isQuote ? 'Devis enregistré.' : 'Brouillon enregistré.'));
      openDocumentView(docId);
    } catch (err) {
      console.error(err);
      errEl.textContent = err.message || "Erreur lors de l'enregistrement.";
      buttons.forEach(b => b.disabled = false);
    }
  }
  document.getElementById('docEditorForm').addEventListener('submit', (e) => { e.preventDefault(); save(false); });
  document.getElementById('docSaveIssueBtn')?.addEventListener('click', () => save(true));
}

// ---- Fiche détail d'un document
function openDocumentView(id) {
  const d = salesDocs[id];
  if (!d) return;
  const isQuote = d.doc_type === 'devis';
  const manager = canManageInvoices();
  const pay = paymentStatus(d);
  const remaining = invoiceRemaining(d);

  const actions = [];
  if (isQuote && ['en_attente', 'accepte'].includes(d.status)) actions.push(['convert', 'Convertir en facture', 'primary']);
  if (!isQuote && d.status === 'brouillon') actions.push(['issue', 'Émettre la facture', 'primary']);
  if (!isQuote && d.status === 'emise' && remaining > 0) actions.push(['pay', 'Enregistrer un paiement', 'primary']);
  if (!isQuote && d.status === 'emise') actions.push(['return', 'Enregistrer un retour', 'ghost']);
  actions.push(['print', 'Imprimer / PDF', 'ghost']);
  if ((isQuote && d.status === 'en_attente') || (!isQuote && d.status === 'brouillon')) actions.push(['edit', 'Modifier', 'ghost']);
  if (isQuote && d.status === 'en_attente') actions.push(['accept', 'Marquer accepté', 'ghost'], ['refuse', 'Marquer refusé', 'ghost']);
  if (isQuote && ['accepte', 'refuse'].includes(d.status)) actions.push(['reopen', 'Remettre en attente', 'ghost']);
  if (!isQuote && d.status === 'emise' && manager) actions.push(['fne', d.fne_number ? 'Modifier le n° FNE' : 'Renseigner le n° FNE', 'ghost']);
  if (isQuote && d.status === 'converti') {
    const inv = Object.values(salesDocs).find(x => x.source_quote_id === d.id);
    if (inv) actions.push(['goto:' + inv.id, 'Voir la facture', 'ghost']);
  }
  if (!isQuote && d.source_quote_id && salesDocs[d.source_quote_id]) actions.push(['goto:' + d.source_quote_id, 'Voir le devis d\'origine', 'ghost']);
  const linkedReturns = Object.entries(returnsMap).filter(([, r]) => r.source_document_id === id);
  if (!isQuote && d.status === 'emise' && manager && (Number(d.amount_paid) || 0) === 0 && linkedReturns.length === 0) actions.push(['cancel', 'Annuler la facture', 'ghost']);
  if ((isQuote && d.status !== 'converti') || (!isQuote && d.status === 'brouillon')) actions.push(['delete', 'Supprimer', 'ghost']);

  const totalsHtml = d.vat_applicable
    ? `<div><span>Total HT</span><span>${fmtFCFA(d.total_ht)}</span></div>
       <div><span>TVA ${Number(d.vat_rate)} %</span><span>${fmtFCFA(d.total_vat)}</span></div>
       <div class="grand"><span>Total TTC</span><span>${fmtFCFA(d.total_ttc)}</span></div>`
    : `<div class="grand"><span>Total (TVA non applicable)</span><span>${fmtFCFA(d.total_ttc)}</span></div>`;
  const paymentsHtml = !isQuote && d.status !== 'brouillon' ? `
    <h3>Paiements</h3>
    ${d.invoice_payments.length === 0 ? '<div class="current-stock-hint">Aucun paiement enregistré.</div>' : `
      <div class="doc-view-lines">${d.invoice_payments.map(p => `
        <div class="doc-view-line"><div class="d">${PAY_METHODS[p.method] || p.method}<small>${fmtDate(p.paid_at)}${p.reference ? ' · Réf. ' + escapeHtml(p.reference) : ''}</small></div>
        <div class="t">${fmtFCFA(p.amount)}</div></div>`).join('')}</div>`}
    <div class="doc-totals">
      <div><span>Déjà payé</span><span>${fmtFCFA(d.amount_paid)}</span></div>
      ${(Number(d.credited_amount) || 0) > 0 ? `<div><span>Déduit par avoir</span><span>${fmtFCFA(d.credited_amount)}</span></div>` : ''}
      <div class="${remaining > 0 ? 'due' : ''}"><span>Reste à payer</span><span>${fmtFCFA(remaining)}</span></div>
    </div>
    ${linkedReturns.length ? `<h3>Retours sur cette facture</h3><div class="doc-view-lines">${linkedReturns.map(([rid, r]) => `
      <div class="doc-view-line" data-return="${rid}" style="cursor:pointer"><div class="d">${escapeHtml(r.number)}<small>${fmtDate(r.return_date)} · ${RETURN_REASONS[r.reason_category] || ''} · ${REFUND_LABELS[r.refund_type] || ''}</small></div>
      <div class="t">${fmtFCFA(r.total_ttc)}</div></div>`).join('')}</div>` : ''}` : '';
  const fneHtml = !isQuote && d.status !== 'brouillon' ? `
    <div class="fne-note">${d.fne_number
      ? `<strong>FNE n° ${escapeHtml(d.fne_number)}</strong> — enregistrée le ${fmtDate(d.fne_recorded_at)}.`
      : `Document de gestion. La facture fiscale officielle est la <strong>FNE</strong>, à émettre sur la plateforme de la DGI ; renseignez ensuite son numéro ici pour garder le lien.`}</div>` : '';

  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheet-head"><h2>${isQuote ? 'Devis' : 'Facture'} ${escapeHtml(d.number || '(brouillon)')}</h2><button class="sheet-close" type="button">✕</button></div>
      <div>${docBadges(d)}</div>
      <div class="doc-meta">
        <div>Client : <strong>${escapeHtml(d.customer_name || 'Non renseigné')}</strong>${d.customer_phone ? ' · ' + escapeHtml(d.customer_phone) : ''}</div>
        <div>Date : <strong>${fmtDate(d.issue_date || d.created_at)}</strong>${isQuote && d.valid_until ? ` · Valable jusqu'au <strong>${fmtDate(d.valid_until)}</strong>` : ''}${!isQuote && d.due_date ? ` · Échéance <strong>${fmtDate(d.due_date)}</strong>` : ''}</div>
        ${!isQuote && d.status === 'emise' ? `<div>Stock : ${d.stock_applied ? 'sorti à l\'émission' : 'non modifié par cette facture'}</div>` : ''}
        ${d.status === 'annulee' ? `<div>Motif d'annulation : <strong>${escapeHtml(d.cancel_reason || '')}</strong></div>` : ''}
      </div>
      <div class="doc-view-lines">${d.sales_document_lines.map(l => `
        <div class="doc-view-line"><div class="d">${escapeHtml(l.description)}<small>${l.qty} × ${fmtFCFA(l.unit_price_ttc)}</small></div>
        <div class="t">${fmtFCFA(l.line_total_ttc)}</div></div>`).join('')}</div>
      <div class="doc-totals">${totalsHtml}</div>
      ${d.notes ? `<div class="current-stock-hint">Notes : ${escapeHtml(d.notes)}</div>` : ''}
      ${paymentsHtml}
      ${fneHtml}
      <div style="display:flex; flex-direction:column; gap:8px">
        ${actions.map(([key, label, kind]) => `<button type="button" class="btn btn-${kind} btn-block" data-action="${key}">${label}</button>`).join('')}
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  backdrop.querySelector('.sheet-close').addEventListener('click', close);

  async function run(rpc, params, okMsg, reopen = true) {
    if (!navigator.onLine) { toast('Connexion internet nécessaire.'); return null; }
    const { data, error } = await supa.rpc(rpc, params);
    if (error) { console.error(error); toast(error.message || 'Erreur.'); return null; }
    markActivity();
    await loadSalesDocuments();
    if (okMsg) toast(okMsg);
    close();
    if (reopen) openDocumentView(typeof reopen === 'string' ? reopen : id);
    return data ?? true;
  }

  backdrop.querySelectorAll('[data-return]').forEach(el => {
    el.addEventListener('click', () => { close(); openReturnView(el.dataset.return); });
  });
  backdrop.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const action = btn.dataset.action;
      if (action.startsWith('goto:')) { close(); openDocumentView(action.slice(5)); return; }
      switch (action) {
        case 'print': printDocument(id); break;
        case 'return': close(); openReturnEditor(id); break;
        case 'edit': close(); openDocumentEditor(d.doc_type, id); break;
        case 'accept': await run('set_quote_status', { p_id: id, p_status: 'accepte' }, 'Devis marqué accepté.'); break;
        case 'refuse': await run('set_quote_status', { p_id: id, p_status: 'refuse' }, 'Devis marqué refusé.'); break;
        case 'reopen': await run('set_quote_status', { p_id: id, p_status: 'en_attente' }, 'Devis remis en attente.'); break;
        case 'convert': {
          if (!navigator.onLine) { toast('Connexion internet nécessaire.'); return; }
          const { data: newId, error } = await supa.rpc('convert_quote_to_invoice', { p_id: id });
          if (error) { toast(error.message); return; }
          await loadSalesDocuments();
          close();
          toast('Facture brouillon créée à partir du devis.');
          openDocumentView(newId);
          break;
        }
        case 'issue':
          close();
          openFormSheet({
            title: 'Émettre la facture',
            intro: `Une fois émise, la facture reçoit un numéro définitif et ne peut plus être modifiée (seulement annulée). Montant : <strong>${fmtFCFA(d.total_ttc)}</strong>.`,
            fields: [{ id: 'stock', type: 'checkbox', label: "Sortir les articles du stock à l'émission", value: true }],
            submitLabel: 'Émettre',
            onSubmit: async (v) => {
              const { data: number, error } = await supa.rpc('issue_invoice', { p_id: id, p_apply_stock: v.stock });
              if (error) throw error;
              markActivity();
              await loadSalesDocuments();
              loadArticles(); loadMovements();
              toast(`Facture ${number} émise.`);
              setTimeout(() => openDocumentView(id), 0);
            },
          });
          break;
        case 'pay':
          close();
          openFormSheet({
            title: 'Enregistrer un paiement',
            intro: `Facture ${escapeHtml(d.number)} — reste à payer : <strong>${fmtFCFA(remaining)}</strong>`,
            fields: [
              { id: 'amount', type: 'number', label: 'Montant reçu (FCFA)', value: remaining, min: 1, step: 1, required: true },
              { id: 'method', type: 'select', label: 'Moyen de paiement', value: 'especes',
                options: Object.entries(PAY_METHODS).map(([value, label]) => ({ value, label })) },
              { id: 'reference', label: 'Référence (n° de transaction, chèque…)', placeholder: 'Facultatif' },
            ],
            submitLabel: 'Enregistrer le paiement',
            onSubmit: async (v) => {
              const amount = Number(v.amount);
              if (!(amount > 0)) throw new Error('Montant invalide.');
              if (amount > remaining) throw new Error(`Le montant dépasse le reste à payer (${fmtFCFA(remaining)}).`);
              const { error } = await supa.rpc('record_invoice_payment', { p_id: id, p_amount: amount, p_method: v.method, p_reference: v.reference || null });
              if (error) throw error;
              markActivity();
              await loadSalesDocuments();
              toast('Paiement enregistré.');
              setTimeout(() => openDocumentView(id), 0);
            },
          });
          break;
        case 'fne':
          close();
          openFormSheet({
            title: 'Numéro FNE',
            intro: 'Saisissez le numéro de la Facture Normalisée Électronique émise sur la plateforme de la DGI pour cette vente. Laissez vide pour retirer le lien.',
            fields: [{ id: 'fne', label: 'N° FNE', value: d.fne_number || '' }],
            submitLabel: 'Enregistrer',
            onSubmit: async (v) => {
              const { error } = await supa.rpc('set_invoice_fne', { p_id: id, p_fne_number: v.fne });
              if (error) throw error;
              await loadSalesDocuments();
              toast('Numéro FNE enregistré.');
              setTimeout(() => openDocumentView(id), 0);
            },
          });
          break;
        case 'cancel':
          close();
          openFormSheet({
            title: 'Annuler la facture',
            intro: `La facture ${escapeHtml(d.number)} sera conservée avec le statut « Annulée » (le numéro n'est jamais réutilisé).${d.stock_applied ? ' Les articles seront remis en stock.' : ''}`,
            fields: [{ id: 'reason', label: "Motif d'annulation", required: true, placeholder: 'Ex : erreur de saisie' }],
            submitLabel: 'Confirmer l\'annulation',
            onSubmit: async (v) => {
              if (!v.reason.trim()) throw new Error('Le motif est obligatoire.');
              const { error } = await supa.rpc('cancel_invoice', { p_id: id, p_reason: v.reason });
              if (error) throw error;
              markActivity();
              await loadSalesDocuments();
              loadArticles(); loadMovements();
              toast('Facture annulée.');
              setTimeout(() => openDocumentView(id), 0);
            },
          });
          break;
        case 'delete':
          close();
          openFormSheet({
            title: isQuote ? 'Supprimer le devis' : 'Supprimer le brouillon',
            intro: `${escapeHtml(docLabel(d))} sera définitivement supprimé.`,
            fields: [],
            submitLabel: 'Supprimer',
            onSubmit: async () => {
              const { error } = await supa.rpc('delete_sales_document', { p_id: id });
              if (error) throw error;
              await loadSalesDocuments();
              toast('Document supprimé.');
            },
          });
          break;
      }
    });
  });
}

    s.legal_name && s.name && s.legal_name !== s.name ? `Enseigne : ${escapeHtml(s.name)}` : '',
    s.address ? escapeHtml(s.address) : '',
    [s.phone, s.email].filter(Boolean).map(escapeHtml).join(' · '),

  ].filter(Boolean).map(x => `<div>${x}</div>`).join('');

    ? `<div><span>Total HT</span><span>${fmtFCFA(d.total_ht)}</span></div>
       <div><span>TVA ${Number(d.vat_rate)} %</span><span>${fmtFCFA(d.total_vat)}</span></div>
       <div class="grand"><span>Total TTC</span><span>${fmtFCFA(d.total_ttc)}</span></div>`

       <div style="font-size:8.5pt;color:#555">TVA non applicable</div>`;
  const paidOrCredited = (Number(d.amount_paid) || 0) > 0 || (Number(d.credited_amount) || 0) > 0;
  const payBlock = !isQuote && d.status === 'emise' && paidOrCredited
    ? `<div><span>Déjà payé</span><span>${fmtFCFA(d.amount_paid)}</span></div>

  let stamp = '';
  if (d.status === 'brouillon') stamp = '<div class="pstamp">BROUILLON — NON ÉMIS</div>';

  const legal = isQuote
    ? `Devis valable jusqu'au ${fmtDate(d.valid_until)}. Prix exprimés en francs CFA${d.vat_applicable ? ', TVA comprise' : ''}.`
    : (d.fne_number
        ? `Facture rattachée à la Facture Normalisée Électronique (FNE) n° ${escapeHtml(d.fne_number)} émise via la plateforme de la DGI.`
        : `Document de gestion interne. La facture fiscale opposable est la Facture Normalisée Électronique (FNE) délivrée via la plateforme de la DGI.`);
  return `
    <div class="pdoc">
      <div class="phead">
        <div class="pshop"><h1>${escapeHtml(shopName)}</h1>${idLines}</div>
        <div class="pinfo">
          <div class="ptitle">${isQuote ? 'DEVIS' : 'FACTURE'}</div>
          <div><strong>N° ${escapeHtml(d.number || '—')}</strong></div>
          <div>Date : ${fmtDate(d.issue_date || d.created_at)}</div>
          ${!isQuote && d.due_date ? `<div>Échéance : ${fmtDate(d.due_date)}</div>` : ''}
          ${stamp}
        </div>
      </div>
      <div class="pclient">
        <div class="lbl">${isQuote ? 'Devis établi pour' : 'Facturé à'}</div>
        <div><strong>${escapeHtml(d.customer_name || 'Client')}</strong></div>
        ${d.customer_phone ? `<div>${escapeHtml(d.customer_phone)}</div>` : ''}

      <table>
        <thead><tr><th>Désignation</th><th class="n">Qté</th><th class="n">Prix unit. TTC</th><th class="n">Total TTC</th></tr></thead>
        <tbody>${d.sales_document_lines.map(l => `
          <tr><td>${escapeHtml(l.description)}</td><td class="n">${l.qty}</td><td class="n">${fmtFCFA(l.unit_price_ttc)}</td><td class="n">${fmtFCFA(l.line_total_ttc)}</td></tr>`).join('')}

      <div class="plegal">${legal}${s.invoice_footer ? `<div style="margin-top:4px">${escapeHtml(s.invoice_footer)}</div>` : ''}</div>
    </div>`;
}

  const d = salesDocs[id];
  if (!d) return;
  document.getElementById('printArea').innerHTML = buildPrintableHtml(d, shopInfo || {});
  setTimeout(() => window.print(), 50);
}
