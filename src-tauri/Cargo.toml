[package]
name = "erp-boutique"
version = "0.1.0"
description = "ERP Boutique — application de bureau multi-boutiques"
edition = "2021"

[lib]
name = "erp_boutique_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Binaire plus petit, démarrage un peu plus lent à compiler — acceptable
# pour une app de bureau qu'on ne recompile pas à chaque lancement.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
